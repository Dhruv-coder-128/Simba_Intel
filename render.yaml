databases:
  - name: simba-intel-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: simba-intel
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: simba-intel.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://simba-intel.onrender.com
      - key: SITE_ID
        value: "1"
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: none
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Wired to the managed Postgres instance declared above - Render injects
      # its connection string automatically, no manual paste/rotation needed.
      # simba_web/settings.py requires this var; there is no SQLite fallback.
      - key: DATABASE_URL
        fromDatabase:
          name: simba-intel-db
          property: connectionString
