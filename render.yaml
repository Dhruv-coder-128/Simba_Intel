databases:
  - name: simba-intel-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: simba-intel
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: simba-intel.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://simba-intel.onrender.com
      - key: SITE_ID
        value: "1"
      # "optional": verification emails go out and are tracked, but login
      # itself isn't blocked - chat/services/verification.py's in-app gate
      # (image gen/Vision/Settings) is what actually enforces this. Requires
      # RESEND_API_KEY below to be set to a real value in Render's dashboard
      # - with it blank, emails are logged and skipped, never delivered,
      # and no one can complete the flow.
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: optional
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Google OAuth Client ID/Secret are NOT env vars - allauth reads them
      # from a SocialApp row in Django admin instead (see README.md).
      # SMTP is not usable at all from Render (outbound network can't reach
      # smtp.gmail.com) - email goes out through Resend's HTTPS API instead
      # (see chat/services/resend_backend.py). EMAIL_BACKEND already
      # defaults to the Resend backend in settings.py, so only the API key
      # needs to be set here.
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Wired to the managed Postgres instance declared above - Render injects
      # its connection string automatically, no manual paste/rotation needed.
      # simba_web/settings.py requires this var; there is no SQLite fallback.
      - key: DATABASE_URL
        fromDatabase:
          name: simba-intel-db
          property: connectionString
      # RBAC (chat/permissions.py): which account chat/migrations/0023_
      # promote_owner_and_backfill_roles.py promotes to Role.OWNER. Set this
      # to the real owner's account email before the first deploy that runs
      # this migration - if left unset, it falls back to whichever existing
      # superuser has the earliest date_joined, which is usually right but
      # is a guess, not a guarantee, on a database that already has more
      # than one. See docs/POSTGRES_MIGRATION.md-style runbooks / the
      # promote_owner management command for fixing this after the fact.
      - key: OWNER_EMAIL
        sync: false
