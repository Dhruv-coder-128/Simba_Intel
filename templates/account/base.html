{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMBA_INTEL - {% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --accent: #00e5ff;
            --accent-dim: rgba(0, 229, 255, 0.3);
            --accent-gold: #bf9b30;
            --bg-primary: #12161c;
            --bg-secondary: #171e27;
            --bg-tertiary: #0d1117;
            --border: rgba(0, 229, 255, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 rgba(0, 229, 255, 0.4); }
            50% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); }
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0d1117 0%, #12161c 50%, #0d1117 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.6s ease forwards;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .auth-logo i {
            font-size: 36px;
            color: var(--accent-gold);
            filter: drop-shadow(0 0 15px rgba(191, 155, 48, 0.3));
        }

        .auth-logo h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            margin: 0;
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin: 0;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-divider span {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a0aabf;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-checkbox-group {
            margin-bottom: 18px;
        }

        .form-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a0aabf;
            cursor: pointer;
            user-select: none;
        }

        .form-checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(18, 22, 28, 0.8);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: var(--accent);
        }

        .btn-primary {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }

        .btn-block {
            width: 100%;
            margin-bottom: 12px;
        }

        .error-message {
            background: rgba(255, 75, 43, 0.1);
            border: 1px solid rgba(255, 75, 43, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            color: #ff4b2b;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .success-message {
            background: rgba(0, 255, 153, 0.1);
            border: 1px solid rgba(0, 255, 153, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            color: #00ff99;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }

        .auth-footer a:hover {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            animation: slideIn 0.3s ease forwards;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100px); opacity: 0; }
        }

        .toast-success {
            background: rgba(0, 255, 153, 0.1);
            border: 1px solid rgba(0, 255, 153, 0.4);
            color: #00ff99;
        }

        .toast-error {
            background: rgba(255, 75, 43, 0.1);
            border: 1px solid rgba(255, 75, 43, 0.4);
            color: #ff4b2b;
        }

        .toast i {
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 20px;
            }

            .auth-logo i {
                font-size: 28px;
            }

            .auth-logo h1 {
                font-size: 22px;
            }

            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toast-container"></div>

    <div class="auth-container">
        <div class="auth-card">
            {% block back_button %}
                {% if user.is_authenticated %}
                    <a href="{% url 'home' %}" class="btn-back">
                        <i class="fa-solid fa-arrow-left"></i>
                        BACK TO SIMBA_INTEL
                    </a>
                {% else %}
                    <a href="{% url 'home' %}" class="btn-back">
                        <i class="fa-solid fa-arrow-left"></i>
                        BACK TO SIMBA_INTEL
                    </a>
                {% endif %}
            {% endblock %}

            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'success' %}
                    showToast("{{ message|escapejs }}", 'success');
                {% elif message.tags == 'error' %}
                    showToast("{{ message|escapejs }}", 'error');
                {% elif message.tags == 'info' %}
                    showToast("{{ message|escapejs }}", 'success');
                {% else %}
                    showToast("{{ message|escapejs }}", 'success');
                {% endif %}
            {% endfor %}
        {% endif %}
    </script>
</body>
</html>
