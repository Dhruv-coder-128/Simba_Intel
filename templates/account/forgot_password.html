{% extends "account/base.html" %}
{% load i18n %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
    <div class="auth-header">
        <div class="auth-logo">
            <i class="fa-solid fa-key"></i>
            <h1>SIMBA_INTEL</h1>
        </div>
        <p class="auth-subtitle">PASSWORD RECOVERY</p>
    </div>

    <p style="color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 20px; line-height: 1.6;">
        Enter the email on your account and we'll send you a 6-digit code to reset your password.
    </p>

    <form method="post" action="{% url 'forgot_password' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email" class="form-label">EMAIL</label>
            <input type="email" id="id_email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-paper-plane"></i>
            SEND RESET CODE
        </button>
    </form>

    <div class="auth-footer">
        <a href="{% url 'account_login' %}"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
    </div>
{% endblock %}
