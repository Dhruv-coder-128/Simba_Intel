{% extends "account/base.html" %}
{% load i18n %}

{% block title %}Set New Password{% endblock %}

{% block content %}
    <div class="auth-header">
        <div class="auth-logo">
            <i class="fa-solid fa-lock"></i>
            <h1>SIMBA_INTEL</h1>
        </div>
        <p class="auth-subtitle">SET A NEW PASSWORD</p>
    </div>

    {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-exclamation-triangle"></i>
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="{% url 'reset_password_otp' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_password1" class="form-label">NEW PASSWORD</label>
            <input type="password" id="id_password1" name="password1" class="form-input" placeholder="••••••••" required autofocus>
        </div>
        <div class="form-group">
            <label for="id_password2" class="form-label">CONFIRM PASSWORD</label>
            <input type="password" id="id_password2" name="password2" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-check"></i>
            RESET PASSWORD
        </button>
    </form>

    <div class="auth-footer">
        <a href="{% url 'account_login' %}"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
    </div>
{% endblock %}
