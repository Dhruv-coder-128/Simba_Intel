<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMBA_INTEL - Maintenance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(0,229,255,0.08), transparent 50%), #0b0c10;
            color: #fff; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .card { text-align: center; max-width: 420px; padding: 40px 24px; }
        .card i { font-size: 44px; color: #00e5ff; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(0,229,255,0.4)); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        h1 { font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; font-size: 22px; margin-bottom: 12px; color: #00e5ff; }
        p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fa-solid fa-gear"></i>
        <h1>SYSTEM MAINTENANCE</h1>
        <p>SIMBA_INTEL is undergoing scheduled maintenance. We'll be back online shortly - thanks for your patience.</p>
    </div>
</body>
</html>
