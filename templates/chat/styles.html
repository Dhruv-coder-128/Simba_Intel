            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }

        .task-history-card:hover {
            border-color: var(--agent-accent);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-1px);
        }

        .task-hist-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .task-hist-title {
            font-family: var(--agent-font-sans);
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .task-hist-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            font-family: var(--agent-font-mono);
            color: var(--agent-text-subtle);
        }

        .task-hist-snippet {
            font-size: 11px;
            color: var(--agent-text-muted);
            line-height: 1.4;
            max-height: 38px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-hist-snippet.error-snippet {
            color: #f87171;
            font-size: 11px;
        }

        .task-hist-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .task-hist-group-header {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--agent-accent);
            padding: 4px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-hist-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 11px;
            flex-shrink: 0;
        }
        .task-hist-icon.completed { color: var(--agent-success); }
        .task-hist-icon.failed { color: var(--agent-danger); }
        .task-hist-icon.cancelled { color: #f59e0b; }
        .task-hist-icon.active { color: var(--agent-accent); }

        .task-hist-status-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .task-hist-status-pill.completed { background: rgba(14, 219, 42, 0.12); color: var(--agent-success); }
        .task-hist-status-pill.failed { background: rgba(239, 68, 68, 0.12); color: var(--agent-danger); }
        .task-hist-status-pill.cancelled { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .task-hist-status-pill.active { background: rgba(59, 130, 246, 0.12); color: var(--agent-accent); }

        /* ==========================================================================
           PART 15-22: VOICE AGENT WORKSPACE
           ========================================================================== */
        .voice-workspace-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            animation: simbaFadeSlideUp 0.25s var(--ease-out-expo);
        }

        .voice-header-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--agent-border);
            flex-wrap: wrap;
        }

        .voice-header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .voice-header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            font-family: var(--agent-font-sans);
            letter-spacing: 0.3px;
        }

        .voice-header-subtitle {
            font-size: 12.5px;
            color: var(--agent-text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .voice-pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #06b6d4;
            box-shadow: 0 0 10px #06b6d4;
            display: inline-block;
            animation: pulseAgentDot 2s infinite ease-in-out;
        }

        /* --- Voice Lifecycle Badge --- */
        .voice-lifecycle-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--agent-radius-xs);
            font-size: 11px;
            font-family: var(--agent-font-mono);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .voice-lifecycle-badge.status-idle,
        .voice-lifecycle-badge.status-ready {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--agent-text-muted);
        }

        .voice-lifecycle-badge.status-listening {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: #06b6d4;
        }

        .voice-lifecycle-badge.status-transcribing {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #a78bfa;
        }

        .voice-lifecycle-badge.status-understanding,
        .voice-lifecycle-badge.status-processing {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #f59e0b;
        }

        .voice-lifecycle-badge.status-acting,
        .voice-lifecycle-badge.status-executing {
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid #06b6d4;
            color: #06b6d4;
        }

        .voice-lifecycle-badge.status-speaking {
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #06b6d4;
        }

        .voice-lifecycle-badge.status-completed {
            background: var(--agent-success-soft);
            border: 1px solid var(--agent-success-border);
            color: var(--agent-success);
        }

        .voice-lifecycle-badge.status-error,
        .voice-lifecycle-badge.status-failed {
            background: var(--agent-danger-soft);
            border: 1px solid var(--agent-danger-border);
            color: #f87171;
        }

        .voice-lifecycle-badge.status-cancelled {
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #94a3b8;
        }

        /* --- Part 22: Voice Workflow Pipeline Card --- */
        .voice-pipeline-card {
            width: 100%;
            background: var(--agent-surface-card);
            border: 1px solid var(--agent-border);
            border-radius: var(--agent-radius-md);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: var(--agent-shadow-xs);
        }

        .voice-pipeline-step {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--agent-font-mono);
            font-size: 10.5px;
            font-weight: 700;
            color: var(--agent-text-subtle);
            padding: 4px 8px;
            border-radius: var(--agent-radius-xs);
            transition: all 0.2s ease;
        }

        .voice-pipeline-step .pipeline-icon {
            font-size: 11px;
        }

        .voice-pipeline-step.active {
            background: var(--agent-accent-soft);
            border: 1px solid var(--agent-border-strong);
            color: var(--agent-accent);
        }

        .voice-pipeline-step.completed {
            background: var(--agent-success-soft);
            border: 1px solid var(--agent-success-border);
            color: var(--agent-success);
        }

        .voice-pipeline-step.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .voice-pipeline-card .pipeline-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
        }

        /* --- Part 18: Voice Hero Microphone Stage --- */
        .voice-hero-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            width: 100%;
        }

        .voice-visualizer-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: grid;
            place-items: center;
        }

        .voice-wave-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(6, 182, 212, 0.15);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .voice-wave-ring.ring-1 {
            inset: -8px;
        }

        .voice-wave-ring.ring-2 {
            inset: -20px;
        }

        .voice-wave-ring.ring-3 {
            inset: -34px;
        }

        .voice-visualizer-container.active .voice-wave-ring {
            border-color: rgba(6, 182, 212, 0.5);
            animation: voiceWavePulse 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .voice-visualizer-container.active .ring-1 {
            animation-delay: 0s;
        }

        .voice-visualizer-container.active .ring-2 {
            animation-delay: 0.35s;
        }

        .voice-visualizer-container.active .ring-3 {
            animation-delay: 0.7s;
        }

        .voice-visualizer-container.processing .voice-wave-ring {
            border-color: rgba(245, 158, 11, 0.4);
            animation: voiceWavePulse 1.2s ease-in-out infinite;
        }

        .voice-visualizer-container.speaking .voice-wave-ring {
            border-color: rgba(6, 182, 212, 0.6);
            animation: voiceWavePulse 1.4s ease-in-out infinite;
        }

        .voice-visualizer-container.completed .voice-wave-ring {
            border-color: rgba(16, 185, 129, 0.4);
        }

        .voice-visualizer-container.error .voice-wave-ring {
            border-color: rgba(239, 68, 68, 0.5);
        }

        .voice-visualizer-container.cancelled .voice-wave-ring {
            border-color: rgba(148, 163, 184, 0.35);
        }

        .voice-main-mic-btn.cancelled {
            border-color: rgba(148, 163, 184, 0.4);
            color: #94a3b8;
        }

        @keyframes voiceWavePulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.22);
                opacity: 0;
            }
        }

        .voice-main-mic-btn {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(6, 182, 212, 0.08));
            border: 2px solid #06b6d4 !important;
            color: #06b6d4 !important;
            font-size: 28px;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
            z-index: 2;
        }

        .voice-main-mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 28px rgba(6, 182, 212, 0.5);
        }

        .voice-main-mic-btn.active {
            background: #06b6d4 !important;
            color: #000000 !important;
            box-shadow: 0 0 32px rgba(6, 182, 212, 0.75);
        }

        .voice-main-mic-btn.processing {
            background: rgba(245, 158, 11, 0.2) !important;
            border-color: #f59e0b !important;
            color: #f59e0b !important;
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
        }

        .voice-main-mic-btn.speaking {
            background: rgba(6, 182, 212, 0.25) !important;
            border-color: #06b6d4 !important;
            color: #06b6d4 !important;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
        }

        .voice-main-mic-btn.completed {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
        }

        .voice-main-mic-btn.error {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #ff5c5c !important;
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.4);
        }

        /* --- Animated Waveform Bars for Speaking State --- */
        .voice-speaking-bars {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
        }

        .voice-speaking-bars span {
            display: inline-block;
            width: 3px;
            height: 100%;
            background: currentColor;
            border-radius: 2px;
            animation: voiceBarAnim 0.8s ease-in-out infinite alternate;
        }

        .voice-speaking-bars span:nth-child(1) {
            animation-delay: 0.1s;
        }

        .voice-speaking-bars span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .voice-speaking-bars span:nth-child(3) {
            animation-delay: 0.5s;
        }

        .voice-speaking-bars span:nth-child(4) {
            animation-delay: 0.2s;
        }

        .voice-speaking-bars span:nth-child(5) {
            animation-delay: 0.4s;
        }

        @keyframes voiceBarAnim {
            0% {
                height: 4px;
            }

            100% {
                height: 24px;
            }
        }



        .voice-hero-subtext {
            font-size: 12px;
            color: var(--agent-text-muted);
            text-align: center;
            margin: 0;
            max-width: 480px;
            line-height: 1.4;
        }

        /* --- Part 19: Voice Control Buttons --- */
        .voice-stage-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-voice-action {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: var(--agent-radius-sm);
            font-size: 12px;
            font-family: var(--agent-font-mono);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--agent-border) !important;
            color: #ffffff !important;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-voice-action:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--agent-border-hover) !important;
        }

        .btn-voice-action.danger {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3) !important;
            color: #f87171 !important;
        }

        .btn-voice-action.danger:hover {
            background: rgba(239, 68, 68, 0.22);
        }

        /* --- Conversational Hands-Free Button --- */
        .btn-voice-action.btn-handsfree-toggle {
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.35) !important;
            color: #06b6d4 !important;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            user-select: none;
        }

        .btn-voice-action.btn-handsfree-toggle:hover {
            background: rgba(6, 182, 212, 0.16);
            border-color: #06b6d4 !important;
            box-shadow: 0 0 14px rgba(6, 182, 212, 0.28);
            color: #ffffff !important;
        }

        .btn-voice-action.btn-handsfree-toggle.active {
            background: rgba(16, 185, 129, 0.18) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
            animation: handsfreePulse 2.4s infinite ease-in-out;
        }

        .btn-voice-action.btn-handsfree-toggle.active.listening {
            background: rgba(6, 182, 212, 0.22) !important;
            border-color: #06b6d4 !important;
            color: #38bdf8 !important;
            box-shadow: 0 0 18px rgba(6, 182, 212, 0.45);
            animation: handsfreePulse 1.8s infinite ease-in-out;
        }

        .btn-voice-action.btn-handsfree-toggle.active.speaking {
            background: rgba(168, 85, 247, 0.22) !important;
            border-color: #a855f7 !important;
            color: #c084fc !important;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.45);
            animation: handsfreePulse 1.6s infinite ease-in-out;
        }

        .btn-voice-action.btn-handsfree-toggle.active.processing {
            background: rgba(245, 158, 11, 0.18) !important;
            border-color: #f59e0b !important;
            color: #fbbf24 !important;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
        }

        .btn-voice-action.btn-handsfree-toggle.error {
            background: rgba(239, 68, 68, 0.18) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }

        @keyframes handsfreePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45);
            }
            70% {
                box-shadow: 0 0 0 9px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* --- Voice Quick Suggestions --- */
        .voice-quick-prompts {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 720px;
            padding: 4px 0;
        }

        .voice-quick-label {
            font-size: 11px;
            font-family: var(--agent-font-mono);
            color: var(--agent-text-subtle);
        }

        .voice-quick-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--agent-border) !important;
            color: var(--agent-text-muted) !important;
            padding: 4px 10px;
            border-radius: var(--agent-radius-full);
            font-size: 11.5px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .voice-quick-chip:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #ffffff !important;
            border-color: var(--agent-border-hover) !important;
        }

        /* --- Part 20 & 21: Dual Voice Cards --- */
        .voice-cards-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .voice-transcript-card,
        .voice-response-card {
            width: 100%;
            background: var(--agent-surface-card);
            border: 1px solid var(--agent-border);
            border-radius: var(--agent-radius-md);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--agent-shadow-xs);
        }

        .voice-response-card {
            background: rgba(6, 182, 212, 0.06);
            border-color: rgba(6, 182, 212, 0.25);
        }

        .voice-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-family: var(--agent-font-mono);
            font-weight: 700;
            color: var(--agent-text-muted);
            letter-spacing: 0.5px;
        }

        .voice-transcript-mode {
            font-size: 9.5px;
            padding: 2px 6px;
            border-radius: var(--agent-radius-xs);
            background: rgba(255, 255, 255, 0.05);
            color: #06b6d4;
            text-transform: uppercase;
        }

        .voice-transcript-text {
            font-size: 13px;
            color: #ffffff;
            line-height: 1.45;
            min-height: 24px;
            max-height: 160px;
            overflow-y: auto;
        }

        .voice-response-text {
            font-size: 13px;
            color: #ffffff;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }

        .btn-sm-stop-speak {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3) !important;
            color: #f87171 !important;
            padding: 3px 8px;
            border-radius: var(--agent-radius-xs);
            font-size: 10.5px;
            font-family: var(--agent-font-mono);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-sm-stop-speak:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ==========================================================================
           UPGRADED AUDIO & VOICE AGENT COCKPIT CSS
           ========================================================================== */
        .voice-spectrum-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            pointer-events: none;
            z-index: 1;
            border-radius: 50%;
        }

        .voice-vu-meter-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
            max-width: 320px;
            margin: 4px auto 0;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--agent-border);
            border-radius: var(--agent-radius-sm);
            box-sizing: border-box;
        }

        .vu-meta {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            font-family: var(--agent-font-mono);
            color: var(--agent-text-subtle);
            letter-spacing: 0.5px;
        }

        .voice-vu-bar {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .voice-vu-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #06b6d4 65%, #f43f5e 100%);
            transition: width 0.05s ease-out;
            border-radius: 3px;
        }

        .voice-vu-markers {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 10%;
        }

        .voice-vu-markers span {
            width: 1px;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        /* --- Voice Cockpit Control Bar --- */
        .voice-control-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            background: rgba(12, 16, 26, 0.85);
            border: 1px solid var(--agent-border-strong);
            border-radius: var(--agent-radius-md);
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .voice-hud-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: var(--agent-font-mono);
        }

        .voice-hud-label {
            color: var(--agent-text-subtle);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .voice-hud-select {
            background: #090d16;
            color: #ffffff;
            border: 1px solid var(--agent-border);
            border-radius: var(--agent-radius-xs);
            padding: 4px 8px;
            font-size: 11px;
            max-width: 170px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .voice-hud-select:focus {
            border-color: var(--agent-accent);
        }

        .voice-speed-pills,
        .voice-mode-pills {
            display: inline-flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px;
            border-radius: var(--agent-radius-xs);
            border: 1px solid var(--agent-border);
        }

        .voice-speed-pill,
        .voice-mode-pill {
            background: transparent;
            border: none;
            color: var(--agent-text-muted);
            font-size: 10.5px;
            font-family: var(--agent-font-mono);
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .voice-speed-pill:hover,
        .voice-mode-pill:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        .voice-speed-pill.active,
        .voice-mode-pill.active {
            background: var(--agent-accent);
            color: #000000;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        .voice-sfx-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--agent-border);
            color: var(--agent-text-muted);
            padding: 5px 10px;
            border-radius: var(--agent-radius-xs);
            font-size: 11px;
            font-family: var(--agent-font-mono);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .voice-sfx-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .voice-sfx-toggle.active {
            border-color: rgba(16, 185, 129, 0.4);
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
        }

        /* --- Conversational Spoken Turn History Feed --- */
        .voice-conversation-feed {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .voice-feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-family: var(--agent-font-mono);
            font-weight: 700;
            color: var(--agent-text-muted);
            letter-spacing: 0.5px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--agent-border);
        }

        .btn-clear-feed {
            background: transparent;
            border: none;
            color: var(--agent-text-subtle);
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            transition: color 0.15s;
        }

        .btn-clear-feed:hover {
            color: #f87171;
        }

        .voice-feed-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .voice-feed-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: var(--agent-text-subtle);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.15);
            border: 1px dashed var(--agent-border);
            border-radius: var(--agent-radius-md);
        }

        /* --- Voice History Feed Cards (Cyberpunk Glassmorphism) --- */
        .voice-feed-card,
        .voice-feed-item {
            background: rgba(13, 18, 28, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--agent-radius-md);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            transition: all 0.2s ease;
            animation: simbaFadeSlideUp 0.25s ease-out;
            position: relative;
        }

        .voice-feed-card:hover,
        .voice-feed-item:hover {
            border-color: rgba(6, 182, 212, 0.35);
            box-shadow: 0 4px 18px rgba(6, 182, 212, 0.12);
        }

        .voice-feed-card.action {
            border-left: 3px solid #f59e0b;
        }

        .feed-card-header,
        .voice-feed-user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .feed-tag {
            font-size: 10.5px;
            font-family: var(--font-sans);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--agent-radius-xs);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .feed-tag.info {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.35);
            color: #06b6d4;
        }

        .feed-tag.action {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #f59e0b;
        }

        .feed-time,
        .voice-feed-time {
            font-size: 10.5px;
            font-family: var(--font-sans);
            color: var(--agent-text-subtle);
        }

        .feed-card-actions,
        .voice-feed-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-feed-action {

        /* ==========================================================================
           PART 24-26: RESPONSIVE BREAKPOINTS (1920 to 375px)
           ========================================================================== */
        @media (max-width: 1024px) {
            .agent-status-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .agent-quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {

            .agent-workspace-wrapper,
            .voice-workspace-wrapper {
                padding: 14px 12px 28px;
                gap: 16px;
            }

            .agent-header-row,
            .voice-header-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .agent-header-right {
                width: 100%;
                justify-content: space-between;
            }

            .agent-system-strip {
                width: 100%;
                justify-content: space-between;
            }

            .agent-status-grid {
                grid-template-columns: 1fr;
            }

            .agent-quick-grid {
                grid-template-columns: 1fr;
            }

            .agent-history-drawer {
                width: 100vw;
                max-width: 100vw;
            }

            .simba-custom-modal {
                max-width: 95vw;
            }

            .voice-pipeline-card {
                overflow-x: auto;
                justify-content: flex-start;
            }

            .voice-visualizer-container {
                width: 110px;
                height: 110px;
            }

            .voice-main-mic-btn {
                width: 72px;
                height: 72px;
                font-size: 24px;
            }

            .composer-area {
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {
            .agent-header-right {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-agent-header-action {
                justify-content: center;
            }

            .agent-context-dropdown-wrap {
                justify-content: space-between;
            }

            .simba-select {
                max-width: 100%;
                flex-grow: 1;
            }
        }

        /* --- Part 35: Accessibility & Prefers-Reduced-Motion --- */
        @media (prefers-reduced-motion: reduce) {

            .agent-pulse-dot,
            .voice-pulse-dot,
            .voice-wave-ring,
            .voice-speaking-bars span {
                animation: none !important;
            }

            .agent-quick-card,
            .agent-status-card,
            .btn-voice-action,
            .voice-main-mic-btn,
            .btn-start-task {
                transition: none !important;
                transform: none !important;
            }

            .agent-history-drawer {
                animation: none !important;
            }
        }

/* Voice Mode Clean Cockpit - Seamless Native Integration */
body[data-session-type="voice"] #input-wrapper,
body[data-session-type="voice"] #btnJumpToLatest,
.voice-workspace-active #input-wrapper {
    display: none !important;
}

.voice-workspace-wrapper {
    position: relative;
    max-width: 800px !important;
    gap: 20px !important;
    padding: 20px 20px 48px !important;
    width: 100% !important;
    margin: 0 auto !important;
    box-sizing: border-box !important;
}

.voice-ambient-glow {
    position: absolute;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 380px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.1) 0%, rgba(var(--accent-rgb), 0.02) 50%, transparent 75%);
    pointer-events: none;
    z-index: 0;
    filter: blur(45px);
}

/* Minimalist Top HUD Bar */
.voice-hud-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(12, 16, 26, 0.75);
    border: 1px solid rgba(var(--accent-rgb), 0.2);
    border-radius: 24px;
    padding: 8px 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(14px);
    box-sizing: border-box;
}

.voice-hud-left,
.voice-hud-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.voice-mode-pill {
    background: rgba(var(--accent-rgb), 0.12);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.2s ease;
}

.voice-mode-pill:hover,
.voice-mode-pill.active {
    background: var(--accent);
    color: #0b0e14;
    box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.3);
}

.voice-speed-pill {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dim);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s ease;
}

.voice-speed-pill:hover {
    color: var(--text);
    border-color: rgba(var(--accent-rgb), 0.4);
}

.voice-shortcut-pill {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.03);
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.voice-shortcut-pill kbd {
    background: rgba(var(--accent-rgb), 0.15);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(var(--accent-rgb), 0.3);
    font-size: 10px;
}

.voice-hud-action-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: all 0.2s ease;
}

.voice-hud-action-btn:hover {
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.1);
}

/* Simba Neural Voice Core (Stage) */
.voice-core-stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 345px;   
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 24px;
    background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.09) 0%, rgba(10, 14, 24, 0.65) 75%);
    border: 1px solid rgba(var(--accent-rgb), 0.22);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 0 40px rgba(var(--accent-rgb), 0.04);
    backdrop-filter: blur(14px);
    box-sizing: border-box;
}

.voice-visualizer-container {
    position: relative;
    width: 146px;
    height: 146px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
}

.voice-main-mic-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.3), rgba(var(--accent-rgb), 0.08));
    border: 2px solid var(--accent) !important;
    color: var(--accent) !important;
    font-size: 32px;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.35);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 5;
}

.voice-main-mic-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 35px rgba(var(--accent-rgb), 0.55);
}

.voice-main-mic-btn.active {
    background: var(--accent) !important;
    color: #0b0e14 !important;
    box-shadow: 0 0 45px var(--accent) !important;
    animation: voiceOrbPulse 1.8s infinite alternate ease-in-out;
}

@keyframes voiceOrbPulse {
    0% { transform: scale(1); box-shadow: 0 0 30px var(--accent); }
    100% { transform: scale(1.08); box-shadow: 0 0 55px var(--accent); }
}

.voice-wave-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(var(--accent-rgb), 0.22);
    pointer-events: none;
    transition: all 0.4s ease;
}

.voice-visualizer-container.active .voice-wave-ring.ring-1 {
    transform: scale(1.22);
    opacity: 0.8;
    border-color: rgba(var(--accent-rgb), 0.45);
}
.voice-visualizer-container.active .voice-wave-ring.ring-2 {
    transform: scale(1.48);
    opacity: 0.5;
    border-color: rgba(var(--accent-rgb), 0.35);
}
.voice-visualizer-container.active .voice-wave-ring.ring-3 {
    transform: scale(1.75);
    opacity: 0.25;
    border-color: rgba(var(--accent-rgb), 0.2);
}

.voice-hero-status {
    font-size: 19px;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    letter-spacing: 0.06em;
    color: var(--text, #fff);

}
