<div class="voice-workspace voice-workspace-wrapper" id="voiceWorkspace">
    <!-- Sleek Minimalist Top HUD Bar (Clean Single-Row Glass Strip) -->
    <div class="voice-hud-bar" id="voiceControlBar">
        <div class="voice-hud-left">
            <button type="button" class="voice-mode-pill active" id="pillModeHandsFree"
                onclick="toggleHandsFreeConversationalMode()" title="Toggle continuous Hands-Free mode">
                <i class="fa-solid fa-headset" id="handsFreeIcon"></i>
                <span id="handsFreeLabel">Hands-Free</span>
            </button>
            <button type="button" class="voice-speed-pill" id="voiceSpeedCycleBtn" onclick="cycleVoiceSpeed()"
                title="Cycle speech speed (1.0x, 1.2x, 1.5x, 0.8x)">
                <i class="fa-solid fa-gauge-high"></i> <span id="voiceSpeedLabel">1.0x</span>
            </button>
            <!-- Hidden inputs to preserve legacy state bindings -->
            <button type="button" id="pillModePushToTalk" onclick="setVoiceInputMode('pushtotalk')"
                style="display:none;"></button>
            <input type="checkbox" id="voiceAutoListenToggle" style="display:none;">
            <select id="voicePersonaSelect" style="display:none;">
                <option value="">Default Browser Voice</option>
            </select>
            <button type="button" id="btnVoiceSfxToggle" onclick="toggleVoiceSfx()" style="display:none;"></button>
            <span id="voiceSfxLabel" style="display:none;">Audio Cues: ON</span>
        </div>
        <div class="voice-hud-right">
            <span class="voice-shortcut-pill" title="Press F2 or Ctrl+Space to toggle listening">
                <kbd>F2</kbd> or <kbd>Ctrl+Space</kbd>
            </span>
            <button type="button" class="voice-hud-action-btn" onclick="clearVoiceWorkspace()"
                title="Reset voice session">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </div>
    </div>

    <!-- Simba Neural Voice Core (Hero Stage) -->
    <div class="voice-core-stage" id="voiceHeroStage">
        <div class="voice-visualizer-container" id="voiceVisualizerContainer">
            <!-- Real-time Web Audio API Canvas Visualizer -->
            <canvas id="voiceSpectrumCanvas" class="voice-spectrum-canvas" width="280" height="280"
                aria-hidden="true"></canvas>
            <div class="voice-wave-ring ring-3" id="voiceRing3"></div>
            <div class="voice-wave-ring ring-2" id="voiceRing2"></div>
            <div class="voice-wave-ring ring-1" id="voiceRing1"></div>
            <button type="button" class="voice-main-mic-btn" id="voiceMainMicBtn" onclick="toggleVoiceAgentListening()"
                aria-label="Toggle Voice Listening">
                <i class="fa-solid fa-microphone" id="voiceMicIcon"></i>
                <div class="voice-speaking-bars" id="voiceSpeakingBars" style="display:none;">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </button>
        </div>

        <div class="voice-hero-status" id="voiceHeroStatus">READY TO LISTEN</div>
        <p class="voice-hero-subtext" id="voiceHeroSubtext">Tap the orb or press F2 to speak to SIMBA</p>

        <!-- Hidden legacy action bridges -->
        <button type="button" id="btnVoiceListen" onclick="toggleVoiceAgentListening()" style="display:none;"></button>
        <button type="button" id="btnStopListening" onclick="stopVoiceListening()" style="display:none;"></button>
        <button type="button" id="btnStopSpeaking" onclick="simbaStopSpeaking()" style="display:none;"></button>
        <button type="button" id="btnHandsFreeToggle" onclick="toggleHandsFreeConversationalMode()"
            style="display:none;"></button>
        <span id="voiceLifecycleBadge" style="display:none;"><i class="fa-solid fa-microphone"></i><span
                id="voiceLifecycleText">IDLE</span></span>
        <span id="voiceTranscriptMode" style="display:none;">STANDBY</span>
    </div>

    <!-- Live Spoken Conversation Surface -->
    <div class="voice-live-surface">
        <!-- Live Transcript Bubble -->
        <div class="voice-transcript-bubble" id="voiceTranscriptCard">
            <div class="transcript-bubble-icon"><i class="fa-solid fa-comment-dots"></i></div>
            <div class="voice-transcript-text" id="voiceTranscriptText">
                "Listening for your voice command..."
            </div>
        </div>

        <!-- Simba Spoken Response Bubble -->
        <div class="voice-response-bubble" id="voiceResponseCard" style="display:none;">
            <div class="response-bubble-header">
                <div class="response-bubble-title">
                    <i class="fa-solid fa-robot"></i> <span>SIMBA RESPONSE</span>
                </div>
                <button type="button" class="btn-bubble-replay" id="voiceCardStopSpeaking" onclick="simbaStopSpeaking()"
                    title="Stop audio">
                    <i class="fa-solid fa-stop"></i> Stop Audio
                </button>
            </div>
            <div class="voice-response-text" id="voiceResponseText"></div>
            <div class="voice-task-progress" id="voiceTaskProgress" style="display:none;"></div>
        </div>
    </div>

    <!-- Recent Spoken History (Clean & Minimalist Feed) -->
    <div class="voice-history-section" id="voiceConversationFeed">
        {% if messages %}
        <div class="voice-history-header">
            <span><i class="fa-solid fa-clock-rotate-left"></i> SPOKEN TURNS</span>
            <button type="button" class="btn-clear-feed" onclick="clearVoiceTurnHistory()" title="Clear history">
                <i class="fa-solid fa-trash-can"></i> Clear
            </button>
        </div>
        <div class="voice-feed-list" id="voiceFeedList">
            {% for m in messages %}
            <div class="voice-feed-card">
                <div class="feed-user-query">
                    <i class="fa-solid fa-microphone"></i>
                    <span>{{ m.user_query }}</span>
                </div>
                <div class="feed-simba-resp">
                    <i class="fa-solid fa-robot"></i>
                    <span class="feed-resp-content">{{ m.ai_response }}</span>
                    <button type="button" class="btn-feed-action" onclick="simbaSpeak('{{ m.ai_response|escapejs }}')"
                        title="Replay voice audio">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="voice-feed-list" id="voiceFeedList">
            <div class="voice-feed-empty" id="voiceFeedEmpty" style="display:none;"></div>
        </div>
        {% endif %}
    </div>
</div>
