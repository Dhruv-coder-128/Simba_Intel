        // Registered exactly once, at top-level script execution (never
        // re-bound from inside a function/callback), so there is no code
        // path that can register a second copy of this listener - confirmed
        // by grepping the file for every `addEventListener('keydown'` call
        // before writing this. Deliberately global (not scoped to "not
        // while typing"): Ctrl/Cmd+K is a modifier chord, so it can never
        // insert a stray character into a focused input/textarea, which is
        // exactly why Slack/Linear/Notion all let it fire while typing too -
        // the `ctrlKey`/`metaKey` check below is what "ignore it as normal
        // typing" actually means here, not disabling the shortcut inside inputs.
        document.addEventListener('keydown', (e) => {
            // Ignore IME composition keystrokes (e.g. typing Japanese/Chinese/
            // Korean) and OS key-repeat while a modifier is held - neither
            // should re-toggle the palette.
            if (e.isComposing || e.repeat) return;

            const isMac = navigator.platform.toUpperCase().includes('MAC');
            const mod = isMac ? e.metaKey : e.ctrlKey;
            // Ctrl//: focuses the sidebar's conversation search - the classic
            // "quick search" shortcut (Slack/Linear/GitHub all use it).
            if (mod && e.key === '/') {
                e.preventDefault();
                const searchInput = document.getElementById('chat-search-input');
                if (searchInput) { searchInput.focus(); searchInput.select(); }
                return;
            }
        });

        // ================= Edit a user message =================
        // Turns the bubble into an editable textarea. On save, POSTs to
        // /messages/<id>/edit/, which creates a sibling user node (the old
        // one stays in the DB) plus a fresh assistant reply as its child, and
        // moves active_leaf there. The paired assistant bubble is updated in
        // place, same "replace, don't append a new turn" pattern as regenerate.
        function editUserMessage(btn) {
            if (isSendingQuery || isGeneratingImage) return;
            const userBlock = btn.closest('.user-block');
            if (!userBlock || userBlock.querySelector('.edit-msg-wrapper')) return;

            const messageId = userBlock.dataset.messageId;
            if (!messageId || messageId === "None" || messageId === "") {
                alert("This message isn't ready to edit yet - try refreshing the page.");
                return;
            }

            const contentDiv = userBlock.querySelector('.content');
            const rawQueryEl = userBlock.querySelector('.raw-query');
            const currentText = rawQueryEl ? rawQueryEl.value : contentDiv.innerText;

            contentDiv.style.display = 'none';
            btn.style.display = 'none';

            const wrapper = document.createElement('div');
            wrapper.className = 'edit-msg-wrapper';
            wrapper.innerHTML = `
                <textarea class="edit-msg-textarea">${escapeHtml(currentText)}</textarea>
                <div class="edit-msg-actions">
                    <button type="button" class="copy-btn edit-save-btn"><i class="fa-solid fa-check"></i> Save &amp; Regenerate</button>
                    <button type="button" class="copy-btn edit-cancel-btn"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
            contentDiv.insertAdjacentElement('afterend', wrapper);

            const textarea = wrapper.querySelector('.edit-msg-textarea');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            const cancelEdit = () => {
                wrapper.remove();
                contentDiv.style.display = '';
                btn.style.display = '';
            };
            wrapper.querySelector('.edit-cancel-btn').addEventListener('click', cancelEdit);
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') cancelEdit();
            });

            wrapper.querySelector('.edit-save-btn').addEventListener('click', () => {
                const newText = textarea.value.trim();
                if (!newText) return;
                submitEditedMessage(userBlock, messageId, newText, wrapper, contentDiv, btn);
            });
        }

        async function submitEditedMessage(userBlock, messageId, newText, wrapper, contentDiv, editBtn) {
            isSendingQuery = true;
            currentAbortController = new AbortController();
            armWatchdog(currentAbortController, TEXT_REQUEST_TIMEOUT_MS);
            setSendButtonBusy(true);

            const modelId =
                document.getElementById("model-selector").value ||
                localStorage.getItem("selected_simba_model") ||
                "quantum-core";

            const simbaBlock = userBlock.nextElementSibling;
            const isTextReply = simbaBlock && simbaBlock.classList.contains('simba-block');
            const previousAssistantHTML = isTextReply ? simbaBlock.innerHTML : null;
            const assistantLabel = isTextReply ? simbaBlock.querySelector('.msg-label') : null;
            const assistantContentDiv = isTextReply ? simbaBlock.querySelector('.content') : null;

            wrapper.innerHTML = `
                <div class="typing-loader">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            if (assistantLabel) assistantLabel.innerText = "SIMBA_STATUS: REGENERATING...";
            if (assistantContentDiv) {
                assistantContentDiv.innerHTML = `
                    <div class="typing-loader">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
            }
            if (isTextReply) {
                Array.from(simbaBlock.children).forEach(child => {
                    if (!child.classList.contains('msg-label') && !child.classList.contains('content')) {
                        child.remove();
                    }
                });
            }

            const restore = () => {
                wrapper.remove();
                contentDiv.style.display = '';
                editBtn.style.display = '';
                if (isTextReply && previousAssistantHTML !== null) simbaBlock.innerHTML = previousAssistantHTML;
            };

            try {
                const res = await fetch(`/messages/${messageId}/edit/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "X-CSRFToken": csrfToken
                    },
                    body: `content=${encodeURIComponent(newText)}&model_id=${encodeURIComponent(modelId)}`,
                    signal: currentAbortController.signal
                });

                if (res.status === 429) {
                    const errorData = await res.json().catch(() => ({}));
                    restore();
                    let rateMsg = errorData.message || "The selected AI provider is temporarily rate-limited. Please wait a moment and try again.";
                    if (errorData.retry_after) rateMsg += ` (Retry in ~${errorData.retry_after}s)`;
                    if (typeof showSimbaToast === 'function') {
                        showSimbaToast(rateMsg, "warning");
                    } else {
                        alert(rateMsg);
                    }
                    setStatus("status-offline", "RATE LIMITED");
                    return;
                }

                if (!res.ok) throw new Error(`Server error: ${res.status}`);

                const contentType = res.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await res.json();
                    restore();
                    if (typeof showSimbaToast === 'function') {
                        showSimbaToast(data.message || data.response || "Edit failed.", "warning");
                    } else {
                        alert(data.message || data.response || "Edit failed");
                    }
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";
                let firstToken = false;
                const renderer = createThrottledStreamRenderer(
                    () => assistantContentDiv && assistantContentDiv.querySelector('.markdown-content'),
                    () => fullResponse,
                );
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    resetWatchdog(currentAbortController, TEXT_REQUEST_TIMEOUT_MS);
                    const chunk = decoder.decode(value, { stream: true });
                    fullResponse += chunk.replace("<think>", "").replace("</think>", "");
                    if (assistantContentDiv) {
                        if (!firstToken) {
                            assistantContentDiv.innerHTML = `<div class="markdown-content"></div>`;
                            if (assistantLabel) assistantLabel.innerText = "SIMBA_RESPONSE";
                            firstToken = true;
                        }
                        renderer.schedule();
                    }
                }
                renderer.flushNow();

                if (!fullResponse.trim()) {
                    // Nothing generated, nothing persisted server-side either -
                    // restore both bubbles to their pre-edit state.
                    restore();
                    return;
                }

                // Commit: the edited text becomes the bubble's displayed content.
                contentDiv.innerText = newText;
                const rawQueryEl = userBlock.querySelector('.raw-query');
                if (rawQueryEl) rawQueryEl.value = newText;
                wrapper.remove();
                contentDiv.style.display = '';
                editBtn.style.display = '';

                if (isTextReply && assistantContentDiv) {
                    assistantContentDiv.className = "content markdown-content";
                    assistantContentDiv.innerHTML = renderMarkdown(fullResponse);

                    let rawDataEl = simbaBlock.querySelector('.raw-data');
                    if (!rawDataEl) {
                        rawDataEl = document.createElement('textarea');
                        rawDataEl.className = 'raw-data';
                        rawDataEl.style.display = 'none';
                        simbaBlock.insertBefore(rawDataEl, assistantContentDiv);
                    }
                    if (rawDataEl) rawDataEl.value = fullResponse;

                    simbaBlock.querySelectorAll('.reply-actions, .reply-mini-actions, .followup-suggestions, .message-reactions').forEach(el => el.remove());
                    simbaBlock.insertAdjacentHTML('beforeend', renderCanonicalAssistantActionsHTML({
                        messageId: simbaBlock.dataset.messageId || '',
                        bookmarked: false,
                        showFollowups: true,
                    }));

                    renderRichContent(simbaBlock);
                    applyCodeButtons(simbaBlock);
                    playBlip();
                }
                const sID = res.headers.get('X-Session-ID');
                if (sID) {
                    try {
                        const leafRes = await fetch(`/session/${sID}/active-leaf/`, { signal: AbortSignal.timeout(10000) });
                        if (leafRes.ok) {
                            const leafData = await leafRes.json();
                            if (leafData.message_id && isTextReply) {
                                simbaBlock.dataset.messageId = leafData.message_id;
                                const footer = simbaBlock.querySelector('.reply-actions');
                                if (footer) await refreshBranchSwitcher(leafData.message_id, footer);
                            }
                            if (leafData.user_message_id) {
                                userBlock.dataset.messageId = leafData.user_message_id;
                                await refreshBranchSwitcher(leafData.user_message_id, userBlock);
                            }
                        }
                    } catch (leafErr) {
                        console.error("Could not refresh message id (non-fatal):", leafErr);
                    }
                }
            } catch (e) {
                if (e.name === "AbortError" && watchdogTimedOut) {
                    restore();
                    alert("Edit timed out - no response from the server. Please try again.");
                } else if (e.name === "AbortError") {
                    restore();
                } else {
                    console.error("Edit failed:", e);
                    restore();
                    alert("Edit failed. Your original message is unchanged.");
                }
            } finally {
                clearWatchdog();
                isSendingQuery = false;
                currentAbortController = null;
                setSendButtonBusy(false);
            }
        }

        function updateSystemStats() {
            if (statsInFlight) return;
            statsInFlight = true;
            fetch('/system_stats/', { signal: AbortSignal.timeout(4000) })
                .then(res => res.json())
                .then(data => {
                    statsInFlight = false;
                    const rawCpu = typeof data.cpu === 'number' ? data.cpu : parseFloat(data.cpu) || 0;
                    const rawRam = typeof data.ram === 'number' ? data.ram : parseFloat(data.ram) || 0;

                    const cpuValEl = document.getElementById("cpu-val");
                    const ramValEl = document.getElementById("ram-val");
                    const cpuBarEl = document.getElementById("cpu-bar");
                    const ramBarEl = document.getElementById("ram-bar");

                    if (cpuValEl) cpuValEl.innerText = rawCpu.toFixed(1) + "%";
                    if (ramValEl) ramValEl.innerText = rawRam.toFixed(1) + "%";

                    const cpuPercent = Math.min(100, Math.max(0, rawCpu));
                    const ramPercent = Math.min(100, Math.max(0, rawRam));

                    if (cpuBarEl) cpuBarEl.style.width = cpuPercent + "%";
                    if (ramBarEl) ramBarEl.style.width = ramPercent + "%";

                    cpuHistory.push(rawCpu);
                    if (cpuHistory.length > HISTORY_LIMIT) cpuHistory.shift();

                    ramHistory.push(rawRam);
                    if (ramHistory.length > HISTORY_LIMIT) ramHistory.shift();
                })
                .catch(() => {
                    statsInFlight = false;
                });
        }

        // ===== SIMBA MIC VOICE SYSTEM =====

        const micBtn = document.getElementById("micBtn")
        const inputBox = document.getElementById("user-input")
        const waveContainer = document.getElementById("wave-container")

        let recognition
        let listening = false


        // ---- SPEECH ENGINE (Unified with SIMBA Desktop Agent Pipeline) ----
        if ('webkitSpeechRecognition' in window) {

            recognition = new webkitSpeechRecognition()

            recognition.continuous = true
            recognition.interimResults = true
            recognition.lang = "en-US"

            recognition.onstart = () => {
                micBtn.classList.add("mic-active")
                if (waveContainer) {
                    waveContainer.style.display = "flex"
                }
            }

            recognition.onresult = (event) => {
                let transcript = ""

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript
                }

                transcript = transcript.trim()

                // show live speech
                inputBox.value = transcript

                if (event.results[event.results.length - 1].isFinal) {
                    const finalTranscript = transcript;
                    inputBox.value = finalTranscript;
                    listening = false;
                    try {
                        recognition.stop();
                    } catch (e) { }

                    // Feed directly into the unified Agent / Chat pipeline
                    if (finalTranscript) {
                        sendQuery(finalTranscript);
                    }
                }
            }

            recognition.onend = () => {
                micBtn.classList.remove("mic-active")
                if (waveContainer) {
                    waveContainer.style.display = "none"
                }
                if (listening) {
                    try {
                        recognition.start()
                    } catch (e) { }
                }
            }
        }


        // ---- MIC BUTTON ----
        micBtn.onclick = () => {

            if (!recognition) return

            if (!listening) {

        function detectCurrentChatContext() {
            if (typeof pendingAttachments !== 'undefined' && pendingAttachments.length > 0) {
                if (pendingAttachments.some(a => a.isImage || /\.(jpe?g|png|webp|gif|bmp)$/i.test(a.name || ''))) return 'image';
                if (pendingAttachments.some(a => /\.pdf$/i.test(a.name || ''))) return 'pdf';
                return 'document';
            }

            const blocks = document.querySelectorAll('#chat-flow .chat-block');
            if (!blocks || blocks.length === 0) return 'general';

            let combined = '';
            const sample = Array.from(blocks).slice(-4);
            sample.forEach(b => { combined += ' ' + (b.innerText || '').toLowerCase(); });

            if (combined.includes('select ') && (combined.includes(' from ') || combined.includes(' where ') || combined.includes('join ') || combined.includes('database') || combined.includes('table '))) {
                return 'sql';
            }
            if (combined.includes('```') || combined.includes('def ') || combined.includes('function ') || combined.includes('const ') || combined.includes('class ') || combined.includes('import ') || combined.includes('react') || combined.includes('python') || combined.includes('javascript')) {
                return 'programming';
            }
            if (combined.includes('image') || combined.includes('photo') || combined.includes('picture') || document.querySelector('.msg-attachment-img')) {
                return 'image';
            }
            if (combined.includes('pdf') || combined.includes('document') || document.querySelector('.msg-attachment-doc')) {
                return 'pdf';
            }
            return 'general';
        }

        // ================= MESSAGE REACTIONS =================
        function toggleReaction(button, messageId, role, reaction) {
            // Toggle active state on button
            button.classList.toggle('active');

            // Get the reaction count element (next sibling)
            const countSpan = button.nextElementSibling;
            let count = parseInt(countSpan.textContent || '0');

            // If button is now active, increment count, else decrement
            if (button.classList.contains('active')) {
                count++;
            } else {
                count = Math.max(0, count - 1); // Don't go below 0
            }

            countSpan.textContent = count;

            // Send AJAX request to update reactions in database
            fetch(`/update_reaction/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    message_id: messageId,
                    role: role,
                    reaction: reaction
                })
            }).then(response => {
                if (!response.ok) {
                    // Revert the UI change on failure
                    button.classList.toggle('active');
                    countSpan.textContent = button.classList.contains('active') ?
                        (parseInt(countSpan.textContent || '0') + 1) :
                        Math.max(0, (parseInt(countSpan.textContent || '0') - 1));
                }
            }).catch(error => {
                // Revert the UI change on error
                button.classList.toggle('active');
                countSpan.textContent = button.classList.contains('active') ?
                    (parseInt(countSpan.textContent || '0') + 1) :
                    Math.max(0, (parseInt(countSpan.textContent || '0') - 1));
                console.error('Error updating reaction:', error);
            });
        }

        // ---- 1. UNIFIED TOAST NOTIFICATION SYSTEM ----
        function showSimbaToast(message, type = 'info', duration = 3200) {
            const container = document.getElementById('simbaToastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `simba-toast toast-${type}`;

            let iconClass = 'fa-solid fa-circle-info';
            if (type === 'success') iconClass = 'fa-solid fa-circle-check';
            else if (type === 'warning') iconClass = 'fa-solid fa-triangle-exclamation';
            else if (type === 'danger') iconClass = 'fa-solid fa-circle-xmark';

            toast.innerHTML = `
                    <i class="${iconClass} simba-toast-icon"></i>
                    <span class="simba-toast-msg">${message}</span>
                    <button type="button" class="simba-toast-close" aria-label="Dismiss">&times;</button>
                `;

            const closeBtn = toast.querySelector('.simba-toast-close');
            const dismiss = () => {
                toast.classList.add('toast-leaving');
                setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 250);
            };

            closeBtn.addEventListener('click', dismiss);
            container.appendChild(toast);

            if (duration > 0) {
                setTimeout(dismiss, duration);
            }
        }

        function renderPaletteResults(query) {
            const container = document.getElementById('cmdPaletteResults');
            if (!container) return;

            const cleanQ = query.trim().toLowerCase();
            const allItems = [...defaultPaletteCatalog, ...getLiveConversationsForPalette()];

            paletteItemsList = allItems.filter(item => {
                if (!cleanQ) return true;
                return item.title.toLowerCase().includes(cleanQ) ||
                    item.subtitle.toLowerCase().includes(cleanQ) ||
                    item.section.toLowerCase().includes(cleanQ);
            });

            if (paletteItemsList.length === 0) {
                container.innerHTML = `
                        <div style="padding: 24px; text-align: center; color: var(--text-dim); font-size: 13px;">
                            <i class="fa-solid fa-magnifying-glass" style="margin-bottom: 8px; font-size: 18px; opacity: 0.5;"></i>
                            <p>No matching commands or conversations found for "${escapeHtml(cleanQ)}"</p>
                        </div>
                    `;
                return;
            }

            // Group items by section
            let html = '';
            let currentSection = '';

            paletteItemsList.forEach((item, idx) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    html += `<div class="palette-section-header">${currentSection}</div>`;
                }
                const isActive = idx === paletteActiveIndex ? 'active' : '';
                html += `
                        <div class="palette-item ${isActive}" data-idx="${idx}" onclick="executePaletteItem(${idx})">
                            <div class="palette-item-icon"><i class="${item.icon}"></i></div>
                            <div class="palette-item-details">

            const isP = (e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'p';
            if (isK || isP) {

        function initComposerAutocomplete() {
            const input = document.getElementById('user-input');
            const menu = document.getElementById('composerAutocomplete');
            const results = document.getElementById('autocompleteResults');
            const header = document.getElementById('autocompleteHeader');
            if (!input || !menu || !results) return;

            input.addEventListener('input', () => {
                const val = input.value;
                const pos = input.selectionStart;
                const textBefore = val.slice(0, pos);
                const lastWord = textBefore.split(/\s+/).pop() || '';

                if (lastWord.startsWith('@') || lastWord.startsWith('/')) {
                    const triggerChar = lastWord[0];

                    currentAutocompleteMatches = autocompleteCatalog.filter(item =>
                        item.trigger === triggerChar && item.token.toLowerCase().includes(lastWord.toLowerCase())
                    );

                    if (currentAutocompleteMatches.length > 0) {
                        header.textContent = triggerChar === '@' ? 'Mention Mode' : 'Slash Commands';
                        autocompleteActiveIdx = 0;
                        results.innerHTML = currentAutocompleteMatches.map((item, i) => `
                                <div class="autocomplete-item ${i === 0 ? 'active' : ''}" data-idx="${i}" onclick="selectAutocompleteToken(${i})">
                                    <div class="autocomplete-icon"><i class="${item.icon}"></i></div>
                                    <span class="autocomplete-token">${escapeHtml(item.token)}</span>
                                    <span class="autocomplete-desc">${escapeHtml(item.desc)}</span>
                                </div>
                            `).join('');
                        menu.classList.add('active');
                        return;
                    }
                }
                menu.classList.remove('active');
            });

            input.addEventListener('keydown', (e) => {
                if (!menu.classList.contains('active')) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    autocompleteActiveIdx = (autocompleteActiveIdx + 1) % currentAutocompleteMatches.length;
                    updateAutocompleteDOM();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    autocompleteActiveIdx = (autocompleteActiveIdx - 1 + currentAutocompleteMatches.length) % currentAutocompleteMatches.length;
                    updateAutocompleteDOM();
                } else if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
                    e.preventDefault();
                    selectAutocompleteToken(autocompleteActiveIdx);
                } else if (e.key === 'Escape') {
                    menu.classList.remove('active');
                }
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && e.target !== input) {
                    menu.classList.remove('active');
                }
            });
        }

        function updateAutocompleteDOM() {
            const items = document.querySelectorAll('.autocomplete-item');
            items.forEach((item, idx) => {
                if (idx === autocompleteActiveIdx) {
                    item.classList.add('active');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function selectAutocompleteToken(idx) {
            const item = currentAutocompleteMatches[idx];
            const input = document.getElementById('user-input');
            const menu = document.getElementById('composerAutocomplete');
            if (!item || !input) return;

            const val = input.value;
            const pos = input.selectionStart;
            const textBefore = val.slice(0, pos);
            const textAfter = val.slice(pos);
            const words = textBefore.split(/\s+/);
            words.pop(); // remove partial token

            const newBefore = (words.length ? words.join(' ') + ' ' : '') + item.token + ' ';
            input.value = newBefore + textAfter;
            input.selectionStart = input.selectionEnd = newBefore.length;
            input.focus();

            if (menu) menu.classList.remove('active');
        }

                if (!e.changedTouches || !e.changedTouches.length) return;
                touchStartX = e.changedTouches[0].screenX;

            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                if (!e.changedTouches || !e.changedTouches.length) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;

                // Swipe left to close sidebar drawer on mobile
                if (deltaX < -70 && Math.abs(deltaY) < 50) {
                    const sidebar = document.getElementById('sidebar');
                    const overlay = document.getElementById('mobile-overlay');
                    if (sidebar && sidebar.classList.contains('mobile-open')) {
                        sidebar.classList.remove('mobile-open');
                        if (overlay) overlay.classList.remove('active');
                    }
                }

                // Swipe down on command palette to dismiss bottom sheet

            window.simbaAgentState = {

        // Helper to extract clean human-readable text from any value or object and NEVER dump raw JSON
        function formatHumanReadableValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'string') {
                let str = val.trim();
                if (!str) return '';
                if (str.includes('SIMBA_TASK_EVENT:')) {
                    str = str.replace(/SIMBA_TASK_EVENT:\s*\{[\s\S]*?\}\s*(?=\n|$)/g, '').trim();
                }
                if (str.includes('SIMBA_STATUS:')) {
                    str = str.replace(/SIMBA_STATUS:[^\n]*\n?/g, '').trim();
                }
                if (!str) return '';
                if ((str.startsWith('{') && str.endsWith('}')) || (str.startsWith('[') && str.endsWith(']'))) {
                    try {
                        const parsed = JSON.parse(str);
                        return formatHumanReadableValue(parsed);
                    } catch(e) {
                        if (str.includes('"steps"') && str.includes('"current_step_index"')) {
                            return '';
                        }
                        return str;
                    }
                }
                return str;
            }
            if (typeof val === 'object') {
                if (val.steps !== undefined || val.current_step_index !== undefined || val.task_id !== undefined) {
                    if (val.final_result) return formatHumanReadableValue(val.final_result);
                    if (val.error) return formatHumanReadableValue(val.error);
                    if (val.failure_reason) return formatHumanReadableValue(val.failure_reason);
                    return '';
                }
                if (val.message && typeof val.message === 'string') return formatHumanReadableValue(val.message);
                if (val.summary && typeof val.summary === 'string') return formatHumanReadableValue(val.summary);
                if (val.result && typeof val.result === 'string') return formatHumanReadableValue(val.result);
                if (val.output && typeof val.output === 'string') return formatHumanReadableValue(val.output);
                if (val.error && typeof val.error === 'string') return formatHumanReadableValue(val.error);
                if (val.text && typeof val.text === 'string') return formatHumanReadableValue(val.text);
                if (val.content && typeof val.content === 'string') return formatHumanReadableValue(val.content);
                if (Array.isArray(val)) {
                    return val.map(item => formatHumanReadableValue(item)).filter(Boolean).join('\n');
                }
                const lines = [];
                for (const [k, v] of Object.entries(val)) {
                    if (v !== null && v !== undefined && v !== '' && typeof v !== 'object') {
                        const label = k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        lines.push(`${label}: ${v}`);
                    }
                }
                return lines.join('\n');
            }
            return String(val);
        }

        function getTaskDateGroup(timestamp) {
            if (!timestamp) return 'Older';
            const taskDate = new Date(timestamp * 1000);
            const now = new Date();

            const isToday = taskDate.getFullYear() === now.getFullYear() &&
                            taskDate.getMonth() === now.getMonth() &&
                            taskDate.getDate() === now.getDate();
            if (isToday) return 'Today';

            const yesterday = new Date(now);
            yesterday.setDate(yesterday.getDate() - 1);
            const isYesterday = taskDate.getFullYear() === yesterday.getFullYear() &&
                                taskDate.getMonth() === yesterday.getMonth() &&
                                taskDate.getDate() === yesterday.getDate();
            if (isYesterday) return 'Yesterday';

            return taskDate.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
        }

        window.loadAgentTaskHistory = async function () {
            const listEl = document.getElementById('agentTaskHistoryList');
            if (!listEl) return;

            // 1. LOADING STATE
            listEl.innerHTML = `
                    <div class="task-hist-loading">
                        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--agent-accent);"></i>
                        <span style="margin-top:10px; display:block; font-size:12px;">Loading agent tasks...</span>
                    </div>
                `;

            try {
                const searchInput = document.getElementById('taskHistorySearchInput');
                const query = searchInput ? searchInput.value.trim() : '';

                let url = '/api/agent/task/history/?';
                if (taskHistoryCurrentStatus && taskHistoryCurrentStatus !== 'all') {
                    url += 'status=' + encodeURIComponent(taskHistoryCurrentStatus) + '&';
                }
                if (query) {
                    url += 'search=' + encodeURIComponent(query);
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP error " + res.status);
                const data = await res.json();
                const tasks = data.tasks || [];

                // 2. EMPTY STATE
                if (tasks.length === 0) {
                    listEl.innerHTML = `
                            <div class="task-hist-empty">
                                <i class="fa-solid fa-clipboard-list fa-2x" style="opacity:0.35; margin-bottom:8px;"></i>
                                <h4 style="font-size:13px; margin:0 0 4px 0;">No Agent tasks yet.</h4>
                                <p style="font-size:11.5px; color:rgba(255,255,255,0.5); margin:0;">${query ? 'No tasks match search query.' : 'Tasks executed in Agent Mode will appear here.'}</p>
                            </div>
                        `;
                    return;
                }

                // 3. GROUP BY DATE: Today, Yesterday, or formatted date
                const groups = {};
                const groupOrder = [];

                tasks.forEach(t => {
                    const ts = t.start_time || t.created_at || 0;
                    const gName = getTaskDateGroup(ts);
                    if (!groups[gName]) {
                        groups[gName] = [];
                        groupOrder.push(gName);
                    }
                    groups[gName].push(t);
                });

                let html = '';
                groupOrder.forEach(gName => {
                    html += `
                        <div class="task-hist-group">
                            <div class="task-hist-group-header">
                                <i class="fa-regular fa-calendar" style="font-size:10px;"></i>
                                <span>${escapeHtml(gName)}</span>
                            </div>
                    `;

                    groups[gName].forEach(t => {
                        const rawStatus = (t.status || 'COMPLETED').toUpperCase();
                        let statusIcon = '<span class="task-hist-icon completed" title="Completed"><i class="fa-solid fa-check"></i></span>';
                        let statusLabel = 'Completed';

                        if (rawStatus.includes('FAIL') || rawStatus.includes('ERROR')) {
                            statusIcon = '<span class="task-hist-icon failed" title="Failed"><i class="fa-solid fa-xmark"></i></span>';
                            statusLabel = 'Failed';
                        } else if (rawStatus.includes('CANCEL')) {
                            statusIcon = '<span class="task-hist-icon cancelled" title="Cancelled"><i class="fa-solid fa-ban"></i></span>';
                            statusLabel = 'Cancelled';
                        } else if (rawStatus.includes('PLAN') || rawStatus.includes('EXEC') || rawStatus.includes('VERIF') || rawStatus.includes('WAIT') || rawStatus.includes('UNDERSTAND')) {
                            statusIcon = '<span class="task-hist-icon active" title="In Progress"><i class="fa-solid fa-circle-notch fa-spin"></i></span>';
                            statusLabel = 'Active';
                        }

                        const ts = t.start_time || t.created_at;
                        const timeStr = ts ? new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                        const durStr = t.duration ? `${t.duration}s` : '';
                        const stepsCount = (t.steps || []).length;
                        const finalClean = t.final_result ? escapeHtml(t.final_result.replace(/<[^>]*>/g, '').trim()) : '';
                        const failureMsg = t.failure_reason || t.error ? escapeHtml(String(t.failure_reason || t.error).trim()) : '';
                        const taskTitle = t.user_request || t.title || 'Untitled Task';
                        const taskTitleEscaped = escapeHtml(taskTitle);

                        html += `
                            <div class="task-history-card" onclick="viewTaskFromHistory('${escapeHtml(t.task_id)}')" title="Click to view details in Agent Workspace">
                                <div class="task-hist-top">
                                    <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">
                                        ${statusIcon}
                                        <span class="task-hist-title" title="${taskTitleEscaped}">${taskTitleEscaped}</span>
                                    </div>
                                    <span class="task-hist-status-pill ${statusLabel.toLowerCase()}">${statusLabel}</span>
                                </div>
                                <div class="task-hist-meta">
                                    ${timeStr ? `<span><i class="fa-regular fa-clock"></i> ${timeStr}</span>` : ''}
                                    ${durStr ? `<span>&bull; ${durStr}</span>` : ''}
                                    ${stepsCount ? `<span>&bull; ${stepsCount} step${stepsCount > 1 ? 's' : ''}</span>` : ''}
                                </div>
                                ${failureMsg ? `<div class="task-hist-snippet error-snippet"><i class="fa-solid fa-triangle-exclamation"></i> ${failureMsg}</div>` : (finalClean ? `<div class="task-hist-snippet">${finalClean}</div>` : '')}
                            </div>
                        `;
                    });

                    html += `</div>`; // Close task-hist-group
                });

                listEl.innerHTML = html;
            } catch (e) {
                console.error("loadAgentTaskHistory error:", e);
                // 4. ERROR STATE
                listEl.innerHTML = `
                        <div class="task-hist-error">
                            <i class="fa-solid fa-triangle-exclamation fa-2x" style="color:#f87171; margin-bottom:8px;"></i>
                            <h4 style="font-size:13px; margin:0 0 4px 0;">Couldn't load agent tasks</h4>
                            <p style="font-size:11.5px; color:rgba(255,255,255,0.5); margin:0 0 10px 0;">Failed to retrieve task records from server.</p>
                            <button type="button" class="btn-use-discovered-tool" onclick="loadAgentTaskHistory()">

        window.renderDiscoveredTools = function () {
            const grid = document.getElementById('discoveryToolsGrid');
            if (!grid) return;

            const searchInput = document.getElementById('discoverySearchInput');
            const query = (searchInput ? searchInput.value.trim().toLowerCase() : '');

            let filtered = allDiscoveredTools.filter(t => {
                if (activeDiscoveryCategory !== 'all' && t.category !== activeDiscoveryCategory) {
                    return false;
                }
                if (query) {
                    const matchName = (t.display_name || t.id || '').toLowerCase().includes(query);
                    const matchDesc = (t.description || '').toLowerCase().includes(query);
                    const matchCat = (t.category || '').toLowerCase().includes(query);
                    const matchPrompt = (t.example_prompt || '').toLowerCase().includes(query);
                    return matchName || matchDesc || matchCat || matchPrompt;
                }
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `

            let html = '';
            filtered.forEach(tool => {

                const offlineBadge = (isDesktop && !tool.available) ? '<span class="discovery-badge offline">Offline</span>' : '';

        window.logAgentTerminal = function (type, text) {
            const term = document.getElementById('agentTerminalBody');
            if (!term || !text) return;
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let tagClass = 't-tag-step';
            let tagText = 'STEP';
            if (type === 'TOOL') { tagClass = 't-tag-tool'; tagText = 'TOOL'; }
            else if (type === 'OUT' || type === 'STDOUT') { tagClass = 't-tag-stdout'; tagText = 'OUT'; }
            else if (type === 'VERIF') { tagClass = 't-tag-verif'; tagText = 'VERIF'; }
            else if (type === 'ERROR') { tagClass = 't-tag-error'; tagText = 'ERR'; }
            else if (type === 'OK') { tagClass = 't-tag-stdout'; tagText = 'DONE'; }

            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerHTML = `<span class="t-ts">${now}</span> <span class="t-tag ${tagClass}">${tagText}</span> <span class="t-content">${escapeHtml(text)}</span>`;
            term.appendChild(line);

            // Keep maximum 50 terminal lines
            while (term.children.length > 50) {
                term.removeChild(term.firstChild);
            }
            term.scrollTop = term.scrollHeight;
        };

        window.copyAgentTerminalOutput = function () {
            const body = document.getElementById('agentTerminalBody');
            if (!body) return;
            const text = body.innerText || '';
            navigator.clipboard.writeText(text).then(() => {
                if (typeof showSimbaToast === 'function') {
                    showSimbaToast('Terminal log copied to clipboard', 'success', 2000);
                }
            }).catch(() => {
                if (typeof showSimbaToast === 'function') {
                    showSimbaToast('Failed to copy terminal log', 'error', 2000);
                }
            });
        };

        window.submitDirectAgentTask = function () {
            const input = document.getElementById('agentDirectInput');
            if (!input) return;
            const text = (input.value || '').trim();
            if (!text) {
                if (typeof showSimbaToast === 'function') {
                    showSimbaToast('Please enter an objective or prompt for the agent', 'warning', 2500);
                }
                input.focus();
                return;
            }
            const composerInput = document.getElementById('user-input');
            if (composerInput) {
                composerInput.value = text;
                if (typeof autoResizeComposerInput === 'function') autoResizeComposerInput(composerInput);
            }
            input.value = '';
            if (typeof logAgentTerminal === 'function') {
                logAgentTerminal('STEP', 'Submitted mission: "' + text.slice(0, 60) + (text.length > 60 ? '...' : '') + '"');
            }
            if (typeof sendQuery === 'function') {
                sendQuery();
            }
        };

        window.pingDesktopBridge = async function () {
            const subEl = document.getElementById('agentBridgeSub');
            const origText = subEl ? subEl.textContent : '';
            if (subEl) subEl.textContent = 'Pinging desktop bridge...';
            const t0 = performance.now();
            try {
                const res = await fetch('/api/agent/status/');
                const ms = Math.round(performance.now() - t0);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.connected) {
                        const dev = data.device || {};
                        if (subEl) {
                            subEl.textContent = `Desktop Agent active (${ms}ms latency). Connected to ${dev.hostname || 'Windows PC'}.`;
                        }
                        if (typeof showSimbaToast === 'function') {
                            showSimbaToast(`Desktop Bridge online (${ms}ms round-trip)`, 'success', 2500);
                        }
                    } else {
                        if (subEl) {
                            subEl.textContent = 'Desktop bridge daemon responded but no local worker connected.';
                        }
                        if (typeof showSimbaToast === 'function') {
                            showSimbaToast('Desktop daemon running but offline', 'warning', 2500);
                        }
                    }
                } else {
                    if (subEl) subEl.textContent = origText;
                    if (typeof showSimbaToast === 'function') {
                        showSimbaToast(`Desktop Bridge unreachable (${res.status})`, 'error', 2500);
                    }
                }
                await window.syncDesktopAgentStatus(true);
            } catch (e) {
                if (subEl) subEl.textContent = origText;
                if (typeof showSimbaToast === 'function') {
                    showSimbaToast('Network error pinging desktop bridge', 'error', 2500);
                }
            }
        };

                if (pcModal && pcModal.style.display !== 'none') {
                    pcModal.style.display = 'none';

            // Keyboard shortcuts [Y] and [N] when agent permission panel is awaiting authorization
            const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
            if (!isTyping) {
                const permPanel = document.getElementById('agentPermissionPanel');
                if (permPanel && permPanel.style.display !== 'none') {
                    if (e.key === 'y' || e.key === 'Y') {

        let _pcStatusInterval = null;
        let _isSyncingDesktopStatus = false;
        let _lastDesktopOnlineState = null;
        let _lastDesktopHost = null;
        let _consecutiveStatusErrors = 0;

        window.syncDesktopAgentStatus = async function (force = false) {
            if (_isSyncingDesktopStatus) return;
            _isSyncingDesktopStatus = true;
            try {
                const res = await fetch('/api/agent/status/');
                if (!res.ok) {
                    _consecutiveStatusErrors++;
                    return;
                }
                _consecutiveStatusErrors = 0;
                const data = await res.json();
                const isOnline = Boolean(data && data.connected);
                const dev = (data && data.device) || {};
                const currentHost = dev.hostname || 'Windows PC';

                // Skip DOM updates if status and device haven't changed (unless forced)
                if (!force && _lastDesktopOnlineState === isOnline && _lastDesktopHost === currentHost) {
                    return;
                }
                _lastDesktopOnlineState = isOnline;
                _lastDesktopHost = currentHost;

                const stateEl = document.getElementById('modalPcStatusText');
                const devEl = document.getElementById('modalPcDeviceText');
                const chip = document.getElementById('pcStatusChip');
                const chipLabel = document.getElementById('pcStatusChipLabel');
                const chipDesc = document.getElementById('pcStatusCardDesc');

                const bridgeBanner = document.getElementById('agentBridgeBanner');
                const bridgeCmdPill = document.getElementById('bridgeCommandPill');
                const bridgeTitle = document.getElementById('bridgeBannerTitle') || document.getElementById('agentBridgeTitle');
                const bridgeSub = document.getElementById('bridgeBannerSub') || document.getElementById('agentBridgeSub');
                const bridgeBeaconDot = document.getElementById('bridgeBeaconDot');
                const bridgeBeaconIcon = document.getElementById('bridgeBeaconIcon');
                const btnPing = document.getElementById('btnPingBridge');
                const pingLabel = document.getElementById('pingBridgeLabel');

                if (isOnline) {
                    if (stateEl) stateEl.innerHTML = '<span style="color:#0edb2a;"><i class="fa-solid fa-circle-check"></i> Connected &amp; Online</span>';
                    if (devEl) devEl.textContent = `${dev.hostname || 'Windows PC'} (${dev.platform || 'Windows'})`;
                    if (chip) {
                        chip.className = 'pc-status-chip connected';
                    }
                    if (chipLabel) {
                        chipLabel.innerHTML = '<i class="fa-brands fa-windows"></i> Desktop Online';
                    }
                    if (chipDesc) {
                        chipDesc.textContent = `Active on ${dev.hostname || 'Windows PC'} (${dev.platform || 'Windows'}). Local automation active.`;
                    }
                    if (headerDot) {
                        headerDot.className = 'status-dot dot-online';
                    }
                    if (headerLabel) {
                        headerLabel.innerHTML = 'Desktop: <strong>Online</strong>';
                    }
                    if (chipHeader) {
                        chipHeader.className = 'system-chip desktop-chip connected';
                        chipHeader.title = `Desktop Agent connected (${dev.hostname || 'Windows PC'})`;
                    }

                    // Bridge Banner Online State - HIDE redundant terminal command when connected!
                    if (bridgeBanner) bridgeBanner.className = 'agent-bridge-banner online';
                    if (bridgeCmdPill) bridgeCmdPill.style.display = 'none';
                    if (bridgeTitle) bridgeTitle.textContent = 'DESKTOP BRIDGE CONNECTED // ' + (dev.hostname || 'WINDOWS PC').toUpperCase();
                    if (bridgeSub) bridgeSub.textContent = `Platform: ${dev.platform || 'Windows'} • TLS WebSocket Active • Local Automation Ready`;
                    if (bridgeBeaconDot) bridgeBeaconDot.className = 'bridge-beacon online';
                    if (bridgeBeaconIcon) bridgeBeaconIcon.className = 'fa-brands fa-windows';
                    if (btnPing) btnPing.className = 'btn-ping-bridge online';
                    if (pingLabel) pingLabel.textContent = 'Bridge Online';
                } else {
                    if (stateEl) stateEl.innerHTML = '<span style="color:#f87171;"><i class="fa-solid fa-circle-xmark"></i> Offline</span>';
                    if (devEl) devEl.textContent = 'No local Desktop Agent active';
                    if (chip) {
                        chip.className = 'pc-status-chip offline';
                    }
                    if (chipLabel) {
                        chipLabel.innerHTML = '<i class="fa-solid fa-desktop"></i> Desktop Offline';
                    }
                    if (chipDesc) {
                        chipDesc.textContent = 'Local computer control requires the Desktop Agent to be connected. Cloud tasks remain active.';
                    }
                    if (headerDot) {
                        headerDot.className = 'status-dot dot-offline';
                    }
                    if (headerLabel) {
                        headerLabel.innerHTML = 'Desktop: <strong>Offline</strong>';
                    }
                    if (chipHeader) {
                        chipHeader.className = 'system-chip desktop-chip offline';
                        chipHeader.title = 'Desktop Agent offline (click to configure)';
                    }

                    // Bridge Banner Offline State - SHOW command ribbon so user can easily copy and connect
                    if (bridgeBanner) bridgeBanner.className = 'agent-bridge-banner';
                    if (bridgeCmdPill) bridgeCmdPill.style.display = 'flex';
                    if (bridgeTitle) bridgeTitle.textContent = 'DESKTOP AGENT DISCONNECTED // LOCAL PC CONTROL STANDING BY';
                    if (bridgeSub) bridgeSub.textContent = 'Run the local bridge command below in terminal to enable mouse, keyboard, app launching, and local file access:';
                    if (bridgeBeaconDot) bridgeBeaconDot.className = 'bridge-beacon';
                    if (bridgeBeaconIcon) bridgeBeaconIcon.className = 'fa-solid fa-tower-broadcast';
                    if (btnPing) btnPing.className = 'btn-ping-bridge';
                    if (pingLabel) pingLabel.textContent = 'Check Bridge';
                }
            } catch (e) {
                // Silently ignore network hiccups to avoid console noise

        function getAudioContext() {
            if (!_audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    _audioCtx = new AudioContextClass();
                }
            }
            if (_audioCtx && _audioCtx.state === 'suspended') {
                _audioCtx.resume();
            }
            return _audioCtx;
        }

        window.playVoiceSfx = function (type) {
            if (!_voiceSfxEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'listen_start') {
                    // Rising sci-fi chime: 520Hz -> 780Hz
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'listen_stop') {
                    // Descending chime: 680Hz -> 420Hz
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(680, now);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'recognized') {
                    // Affirmative ping: 880Hz
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'action') {
                    // Futuristic action warble: 440Hz -> 880Hz
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.13);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'error') {
                    // Warning tone: 220Hz -> 180Hz
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.16);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.21);
                }
            } catch (e) {
                // Ignore audio context autoplay warnings
            }
        };

        async function startMicAudioCapture() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                if (!_micStream) {
                    _micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                }
                if (!_analyserNode) {
                    _analyserNode = ctx.createAnalyser();
                    _analyserNode.fftSize = 128;
                    _analyserNode.smoothingTimeConstant = 0.75;
                }
                if (!_micSourceNode && _micStream) {
                    _micSourceNode = ctx.createMediaStreamSource(_micStream);
                    _micSourceNode.connect(_analyserNode);
                    // Do NOT connect analyser to destination to avoid speaker acoustic feedback
                }
            } catch (e) {
                // Mic permission might still be prompting or denied
            }
        }

        function stopMicAudioCapture() {
            if (_micStream) {
                _micStream.getTracks().forEach(t => t.stop());
                _micStream = null;
            }
            if (_micSourceNode) {
                try { _micSourceNode.disconnect(); } catch (e) { }
                _micSourceNode = null;
            }
        }

        function initVoiceSpectrumVisualizer() {
            const canvas = document.getElementById('voiceSpectrumCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            const vuFill = document.getElementById('voiceVuFill');
            const vuDb = document.getElementById('voiceVuDb');

            let synthPhase = 0;

            function renderFrame() {
                _visualizerAnimFrame = requestAnimationFrame(renderFrame);

                const w = canvas.width || 300;
                const h = canvas.height || 300;
                const cx = w / 2;
                const cy = h / 2;
                const radius = 95;

                ctx.clearRect(0, 0, w, h);

                const status = (window.simbaVoiceState && window.simbaVoiceState.status) || 'READY';

                if (status === 'LISTENING' || status === 'TRANSCRIBING') {
                    let freqData = new Uint8Array(64);
                    let timeData = new Uint8Array(64);
                    let rms = 0;

                    if (_analyserNode) {
                        _analyserNode.getByteFrequencyData(freqData);
                        _analyserNode.getByteTimeDomainData(timeData);

                        let sumSquares = 0;
                        for (let i = 0; i < timeData.length; i++) {
                            const norm = (timeData[i] - 128) / 128;
                            sumSquares += norm * norm;
                        }
                        rms = Math.sqrt(sumSquares / timeData.length);
                    } else {
                        rms = 0.12 + Math.sin(Date.now() / 250) * 0.08;
                    }

                    // Update VU Meter
                    const db = rms > 0.002 ? Math.max(-60, Math.min(0, Math.round(20 * Math.log10(rms)))) : -60;
                    const percent = Math.min(100, Math.max(0, Math.round(((db + 60) / 60) * 100)));
                    if (vuFill) vuFill.style.width = percent + '%';
                    if (vuDb) vuDb.textContent = db > -60 ? `${db} dB` : '-- dB';

                    // Draw 36 radial equalizer bars
                    const numBars = 36;
                    const angleStep = (Math.PI * 2) / numBars;
                    synthPhase += 0.02;

                    for (let i = 0; i < numBars; i++) {
                        const angle = i * angleStep + synthPhase;
                        const freqVal = freqData[i % freqData.length] || (rms * 255);
                        const barHeight = Math.max(4, (freqVal / 255) * 44);

                        const x1 = cx + Math.cos(angle) * (radius + 4);
                        const y1 = cy + Math.sin(angle) * (radius + 4);
                        const x2 = cx + Math.cos(angle) * (radius + 4 + barHeight);
                        const y2 = cy + Math.sin(angle) * (radius + 4 + barHeight);

                        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
                        grad.addColorStop(0, '#06b6d4');
                        grad.addColorStop(1, '#ec4899');

                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 3;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }

                } else if (status === 'SPEAKING') {
                    // Dynamic synth speech pulse wave
                    synthPhase += 0.08;
                    const pulse = 0.5 + Math.sin(synthPhase * 1.5) * 0.35 + Math.cos(synthPhase * 3.2) * 0.15;

                    if (vuFill) vuFill.style.width = Math.round(pulse * 75) + '%';
                    if (vuDb) vuDb.textContent = 'TALKING';

                    const numPoints = 64;
                    ctx.beginPath();
                    for (let i = 0; i <= numPoints; i++) {
                        const theta = (i / numPoints) * Math.PI * 2;
                        const waveOffset = Math.sin(theta * 6 + synthPhase * 2) * (14 * pulse);
                        const r = radius + 8 + waveOffset;
                        const x = cx + Math.cos(theta) * r;
                        const y = cy + Math.sin(theta) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 12;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                } else if (status === 'UNDERSTANDING' || status === 'ACTING') {
                    // Quantum rotating radar sweep
                    synthPhase += 0.06;
                    if (vuFill) vuFill.style.width = '45%';
                    if (vuDb) vuDb.textContent = 'THINKING';

                    ctx.beginPath();
                    ctx.arc(cx, cy, radius + 8, synthPhase, synthPhase + Math.PI * 1.3);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                } else {
                    // READY / IDLE breathing radar ring
                    synthPhase += 0.02;
                    const breath = Math.sin(synthPhase) * 3;
                    if (vuFill) vuFill.style.width = '0%';
                    if (vuDb) vuDb.textContent = '-- dB';

                    ctx.beginPath();
                    ctx.arc(cx, cy, radius + 6 + breath, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.25)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            renderFrame();
        }

        const VOICE_STOP_REGEX = /\b(?:stop|stop talking|stop audio|be quiet|shut up|cancel|mute|pause|quiet|abort|hold on|enough)\b/i;
        const VOICE_STOP_PHRASE_REGEX = /\b(?:stop|stop talking|stop audio|be quiet|shut up|cancel)\b/i;

        function isVoiceStopCommand(text) {
            if (!text) return false;
            const clean = text.trim().toLowerCase().replace(/[.,!?;:]/g, '');
            return VOICE_STOP_REGEX.test(clean) || VOICE_STOP_PHRASE_REGEX.test(clean);
        }

        function isAcousticEcho(spoken, utterance) {
            if (!utterance || !spoken) return false;
            const spokenWords = spoken.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 2);
            if (spokenWords.length === 0) return true;
            const utteranceLower = utterance.toLowerCase();
            let matching = 0;
            for (const w of spokenWords) {
                if (utteranceLower.includes(w)) matching++;
            }
            return (matching / spokenWords.length) >= 0.65;
        }

        function isSubstantiveSpeech(text) {
            if (!text || typeof text !== 'string') return false;
            const trimmed = text.trim();
            if (trimmed.length < 2) return false;
            if (/^(?:uh|um|ah|er|eh|hm|hmm|mm|shh|psst)$/i.test(trimmed)) return false;
            return true;
        }

        window.simbaVoiceStateMachine = {
            allowedTransitions: {
                'READY': ['LISTENING', 'ERROR'],
                'LISTENING': ['TRANSCRIBING', 'UNDERSTANDING', 'CANCELLED', 'ERROR', 'READY'],
                'TRANSCRIBING': ['UNDERSTANDING', 'CANCELLED', 'ERROR', 'READY', 'LISTENING'],
                'UNDERSTANDING': ['ACTING', 'SPEAKING', 'CANCELLED', 'ERROR', 'READY', 'LISTENING'],
                'ACTING': ['SPEAKING', 'CANCELLED', 'ERROR', 'READY', 'LISTENING'],
                'SPEAKING': ['COMPLETED', 'CANCELLED', 'ERROR', 'READY', 'LISTENING'],
                'COMPLETED': ['READY', 'LISTENING', 'SPEAKING'],
                'CANCELLED': ['READY', 'LISTENING'],

            },

            getStatus: function () {

            canTransition: function (nextStatus) {
                const current = window.simbaVoiceState.status;
                const valid = this.allowedTransitions[current];
                return valid ? valid.includes(nextStatus) : false;
            },

            transition: function (nextStatus, meta) {
                let upper = (nextStatus || 'READY').toUpperCase().trim();
                if (upper === 'IDLE') upper = 'READY';
                if (upper === 'FAILED') upper = 'ERROR';
                if (upper === 'ABORTED') upper = 'CANCELLED';

                const current = window.simbaVoiceState.status;
                if (current === upper) {
                    updateVoiceUI(upper, meta);
                    return true;
                }

                // If starting a new interaction from terminal/error states, ensure clean pass through READY
                if (upper === 'LISTENING' && (current === 'COMPLETED' || current === 'CANCELLED' || current === 'ERROR')) {
                    this.transition('READY');
                }

                // Validate transition
                if (!this.canTransition(upper)) {
                    if (upper !== 'READY' && upper !== 'ERROR' && upper !== 'CANCELLED' && upper !== 'LISTENING') {
                        console.warn(`[VoiceStateMachine] Blocked invalid transition: ${current} -> ${upper}`);
                        return false;
                    }
                }

                // State lifecycle setup & cleanup
                if (upper === 'LISTENING') {
                    window.simbaVoiceState.isCancelled = false;
                    window.simbaVoiceState.error = null;
                    window.simbaVoiceState.errorMsg = null;
                    window.simbaVoiceState.transcript = '';
                    window.simbaVoiceState.interimTranscript = '';
                    window.simbaVoiceState.interactionId = 'voice_' + Date.now();
                } else if (upper === 'CANCELLED') {
                    window.simbaVoiceState.isCancelled = true;
                    simbaStopSpeaking(false);
                    if (voiceRecognition && isVoiceListening && !isHandsFreeConversationalActive) {
                        try { voiceRecognition.stop(); } catch (e) { }
                        isVoiceListening = false;
                    }
                } else if (upper === 'ERROR') {
                    window.simbaVoiceState.error = (meta && (meta.error || meta.label)) || 'VOICE ERROR';
                    window.simbaVoiceState.errorMsg = (meta && (meta.errorMsg || meta.message)) || 'An error occurred';
                }

                const prev = window.simbaVoiceState.status;
                window.simbaVoiceState.status = upper;
                currentVoiceState = upper;

                updateVoiceUI(upper, meta);

                try {
                    window.dispatchEvent(new CustomEvent('simba:voice-state-changed', {
                        detail: {
                            previousStatus: prev,
                            currentStatus: upper,
                            meta: meta || {}
                        }
                    }));
                } catch (e) { }

                return true;
            },

            cancel: function (reason) {
                this.transition('CANCELLED', {
                    label: 'Cancelled',
                    message: reason || 'Voice interaction cancelled by user.'
                });
            },

            reset: function () {
                this.transition('READY');
            }
        };

        window.setVoiceState = function (state, label, errorMsg, meta) {
            const combinedMeta = Object.assign({}, meta || {});
            if (label) combinedMeta.label = label;
            if (errorMsg) combinedMeta.errorMsg = errorMsg;
            return window.simbaVoiceStateMachine.transition(state, combinedMeta);
        };

            if (upper === 'READY') {

            } else if (upper === 'ACTING') {

                iconClass = 'fa-check';

                displayLabel = (meta && meta.label) || 'ERROR';

            } else if (upper === 'CANCELLED') {

                } else if (upper === 'ERROR') {

                    if (errType.includes('MIC') || errType.includes('SPEECH')) {
                        modeLabel.textContent = 'MIC ERROR';
                        modeLabel.style.color = '#ef4444';
                    } else {
                        modeLabel.textContent = 'STANDBY';
                        modeLabel.style.color = '';
                    }
                } else {
                    modeLabel.textContent = isHandsFreeConversationalActive ? 'HANDS-FREE' : 'STANDBY';
                    modeLabel.style.color = isHandsFreeConversationalActive ? '#10b981' : '';
                }
            }

            if (badge) {
                badge.className = `voice-lifecycle-badge status-${upper.toLowerCase()}`;
                const iconEl = badge.querySelector('i');
                if (iconEl) iconEl.className = `fa-solid ${iconClass}`;
            }

            if (visualizer) {
                visualizer.className = 'voice-visualizer-container';
                if (upper === 'LISTENING') visualizer.classList.add('active');
                else if (upper === 'TRANSCRIBING' || upper === 'UNDERSTANDING' || upper === 'ACTING') visualizer.classList.add('processing');
                else if (upper === 'SPEAKING') visualizer.classList.add('speaking');
                else if (upper === 'COMPLETED') visualizer.classList.add('completed');
                else if (upper === 'ERROR') visualizer.classList.add('error');
                else if (upper === 'CANCELLED') visualizer.classList.add('cancelled');
            }

            if (micBtn) {
                micBtn.className = 'voice-main-mic-btn';
                if (upper === 'LISTENING') micBtn.classList.add('active');
                else if (upper === 'TRANSCRIBING' || upper === 'UNDERSTANDING' || upper === 'ACTING') micBtn.classList.add('processing');
                else if (upper === 'SPEAKING') micBtn.classList.add('speaking');
                else if (upper === 'COMPLETED') micBtn.classList.add('completed');
                else if (upper === 'ERROR') micBtn.classList.add('error');
                else if (upper === 'CANCELLED') micBtn.classList.add('cancelled');

            if (micIcon && speakingBars) {

                    micIcon.style.display = 'none';

                    micIcon.className = 'fa-solid fa-check';
                    micIcon.style.display = 'inline-block';
                    speakingBars.style.display = 'none';
                } else if (upper === 'ERROR') {
                    micIcon.className = 'fa-solid fa-triangle-exclamation';
                    micIcon.style.display = 'inline-block';
                    speakingBars.style.display = 'none';
                } else if (upper === 'CANCELLED') {
                    micIcon.className = 'fa-solid fa-ban';
                    micIcon.style.display = 'inline-block';
                    speakingBars.style.display = 'none';
                } else {
                    micIcon.className = isHandsFreeConversationalActive ? 'fa-solid fa-headset' : 'fa-solid fa-microphone';
                    micIcon.style.display = 'inline-block';
                    speakingBars.style.display = 'none';

            if (heroStatus) heroStatus.textContent = heroTitle;
            if (heroSubtext) heroSubtext.textContent = subtext;

            const btnVoiceListen = document.getElementById('btnVoiceListen');
            if (btnVoiceListen) {
                if (upper === 'LISTENING' && !isHandsFreeConversationalActive) {

                btnStopListening.style.display = (upper === 'LISTENING' || upper === 'TRANSCRIBING') && !isHandsFreeConversationalActive ? 'inline-flex' : 'none';

            const voiceCardStopSpeaking = document.getElementById('voiceCardStopSpeaking');
            if (voiceCardStopSpeaking) {

            // Update Voice Workflow Pipeline Card
            const pipeSteps = ['pipeStepListen', 'pipeStepTranscribe', 'pipeStepUnderstand', 'pipeStepAct', 'pipeStepSpeak'];
            pipeSteps.forEach(sId => {
                const el = document.getElementById(sId);
