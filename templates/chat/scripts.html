                el.classList.remove('active', 'completed', 'error');

                if (upper === 'LISTENING') {
                    if (sId === 'pipeStepListen') el.classList.add('active');
                } else if (upper === 'TRANSCRIBING') {
                    if (sId === 'pipeStepListen') el.classList.add('completed');
                    if (sId === 'pipeStepTranscribe') el.classList.add('active');
                } else if (upper === 'UNDERSTANDING') {
                    if (sId === 'pipeStepListen' || sId === 'pipeStepTranscribe') el.classList.add('completed');
                    if (sId === 'pipeStepUnderstand') el.classList.add('active');
                } else if (upper === 'ACTING') {
                    if (sId === 'pipeStepListen' || sId === 'pipeStepTranscribe' || sId === 'pipeStepUnderstand') el.classList.add('completed');
                    if (sId === 'pipeStepAct') el.classList.add('active');
                } else if (upper === 'SPEAKING') {
                    if (sId === 'pipeStepListen' || sId === 'pipeStepTranscribe' || sId === 'pipeStepUnderstand') el.classList.add('completed');
                    if (window.isVoiceActionRequest || (window.simbaAgentState && window.simbaAgentState.taskId)) {
                        if (sId === 'pipeStepAct') el.classList.add('completed');
                    }
                    if (sId === 'pipeStepSpeak') el.classList.add('active');
                } else if (upper === 'COMPLETED') {
                    if (sId === 'pipeStepListen' || sId === 'pipeStepTranscribe' || sId === 'pipeStepUnderstand' || sId === 'pipeStepSpeak') {
                        el.classList.add('completed');
                    }
                    if ((window.isVoiceActionRequest || (window.simbaAgentState && window.simbaAgentState.taskId)) && sId === 'pipeStepAct') {
                        el.classList.add('completed');
                    }
                } else if (upper === 'ERROR') {
                    el.classList.remove('active');
                } else if (upper === 'CANCELLED') {
                    el.classList.remove('active');
                }
            });
        }

        window.initVoiceAgent = function () {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            try {
                voiceRecognition = new SpeechRecognition();
                voiceRecognition.continuous = true; // Continuous listening enables conversational loop & barge-in
                voiceRecognition.interimResults = true;
                voiceRecognition.lang = "en-US";

                voiceRecognition.onstart = function () {
                    isVoiceListening = true;
                    if (typeof startMicAudioCapture === 'function') startMicAudioCapture();
                    if (typeof playVoiceSfx === 'function') playVoiceSfx('listen_start');
                    if (window.simbaVoiceState.status !== 'SPEAKING' &&
                        window.simbaVoiceState.status !== 'UNDERSTANDING' &&
                        window.simbaVoiceState.status !== 'ACTING') {
                        setVoiceState('LISTENING');
                    }
                };

                voiceRecognition.onresult = function (event) {
                    // Privacy / Boundary: If Hands-Free is OFF and single-turn listening is not active, ignore audio
                    if (!isHandsFreeConversationalActive && !isVoiceListening) {
                        return;
                    }

                    let interim = '';
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interim += transcript;
                        }
                    }
                    const liveText = (finalTranscript || interim).trim();
                    if (!liveText) return;

                    const lowerLive = liveText.toLowerCase();
                    const isStop = isVoiceStopCommand(liveText);

                    // BARGE-IN & INTERRUPTION HANDLING (Directives 5, 6, 7)
                    if (isSimbaSpeaking) {
                        if (isStop) {
                            console.log('[Voice] Stop command intercepted during TTS playback:', liveText);
                            simbaStopSpeaking(true);
                            activeVoiceTurnId = 'vturn_' + (++voiceTurnCounter); // Invalidate in-flight responses
                            if (currentAbortController) {
                                try { currentAbortController.abort(); } catch (e) { }
                            }
                            setVoiceState('READY', 'AUDIO STOPPED', null, { subtext: 'Voice stopped on command.' });
                            showSimbaToast('Voice stopped', 'info', 1600);
                            return;
                        }

                        // Filter acoustic echo of Simba's own voice coming through speakers
                        if (isAcousticEcho(lowerLive, activeVoiceUtteranceText)) {
                            return;
                        }

                        // User interruption / new question while Simba is speaking
                        console.log('[Voice] User barge-in detected:', liveText);
                        simbaStopSpeaking(false);
                        activeVoiceTurnId = 'vturn_' + (++voiceTurnCounter); // Invalidate previous response
                        if (currentAbortController) {
                            try { currentAbortController.abort(); } catch (e) { }
                        }
                        setVoiceState('LISTENING', 'Listening...', null, { subtext: 'Interrupted. Hearing your new question...' });
                    }

                    // Update live transcript display in UI
                    const transcriptBox = document.getElementById('voiceTranscriptText');
                    if (transcriptBox && liveText) {
                        transcriptBox.textContent = `"${liveText}"`;
                    }

                    // USER SPEAKING / TRANSCRIBING STATE
                    if (liveText && !finalTranscript) {
                        if (window.simbaVoiceState.status !== 'TRANSCRIBING' && !isSimbaSpeaking) {
                            setVoiceState('TRANSCRIBING');
                        }
                    }

                    // FINAL TRANSCRIPT DETECTED (Turn Complete)
                    if (finalTranscript) {
                        const cleanFinal = finalTranscript.trim();

                        // 1. Check for non-substantive noise / vocal artifacts
                        if (!isSubstantiveSpeech(cleanFinal)) {
                            return;
                        }

                        // 2. Stop command handling
                        if (isStop) {
                            console.log('[Voice] Stop command received:', cleanFinal);
                            simbaStopSpeaking(false);
                            cancelVoiceInteraction('Voice stop command detected');
                            if (isHandsFreeConversationalActive) {
                                setVoiceState('LISTENING', 'Listening...', null, { subtext: 'Stopped. Listening for your next query...' });
                            }
                            return;
                        }

                        // 3. Deduplication / debounce (ignore identical utterance repeated within 2.5s)
                        const now = Date.now();
                        if (cleanFinal.toLowerCase() === lastProcessedVoiceTranscript.toLowerCase() && (now - lastProcessedVoiceTimestamp) < 2500) {
                            console.log('[Voice] Ignored duplicate speech turn:', cleanFinal);
                            return;
                        }
                        lastProcessedVoiceTranscript = cleanFinal;
                        lastProcessedVoiceTimestamp = now;

                        // 4. Update Turn & Session IDs
                        const currentTurnId = 'vturn_' + (++voiceTurnCounter);
                        activeVoiceTurnId = currentTurnId;
                        const currentSessionId = activeVoiceSessionId;

                        if (transcriptBox) {
                            transcriptBox.textContent = `"${cleanFinal}"`;
                        }

                        // 5. In manual single-turn mode, stop listening after final transcript
                        if (!isHandsFreeConversationalActive) {
                            isVoiceListening = false;
                            try { voiceRecognition.stop(); } catch (e) { }
                        }

                        // 6. Process the query
                        if (typeof playVoiceSfx === 'function') playVoiceSfx('recognized');
                        handleVoiceCommand(cleanFinal, currentTurnId, currentSessionId);
                    }
                };

                voiceRecognition.onerror = function (event) {
                    const err = event.error || '';
                    if (err === 'no-speech') {
                        // In handsfree, quiet ambient periods are normal; do not flip to error
                        if (isHandsFreeConversationalActive) {
                            return;
                        }
                        setVoiceState('READY', 'Ready to Listen', 'No speech detected. Tap the microphone to speak.');
                        return;
                    }
                    if (err === 'aborted') {
                        // Normal when stopped programmatically
                        return;
                    }
                    isVoiceListening = false;
                    if (err === 'not-allowed' || err === 'service-not-allowed') {
                        setVoiceState('ERROR', 'MIC DENIED', 'Microphone access was denied. Please allow microphone permissions in browser settings.');
                    } else if (err === 'audio-capture') {
                        setVoiceState('ERROR', 'MIC UNAVAILABLE', 'No microphone detected or microphone is currently unavailable.');
                    } else if (err === 'network') {
                        setVoiceState('ERROR', 'NETWORK ERROR', 'Speech recognition network connection error occurred.');
                    } else {
                        setVoiceState('ERROR', 'SPEECH ERROR', 'Speech capture error: ' + err);
                    }
                };

                voiceRecognition.onend = function () {
                    isVoiceListening = false;
                    // Auto-restart recognition in Hands-Free mode when idle/listening
                    if (isHandsFreeConversationalActive) {
                        const status = window.simbaVoiceState.status;
                        if (!isSimbaSpeaking && status !== 'UNDERSTANDING' && status !== 'ACTING') {
                            clearTimeout(voiceAutoRestartTimer);
                            voiceAutoRestartTimer = setTimeout(() => {
                                if (isHandsFreeConversationalActive && !isSimbaSpeaking) {
                                    ensureVoiceRecognitionRunning();
                                }
                            }, 350);
                        }
                    } else {
                        if (window.simbaVoiceState.status === 'LISTENING' || window.simbaVoiceState.status === 'TRANSCRIBING') {
                            setVoiceState('READY');
                        }
                    }
                };
            } catch (e) {
                console.warn("SpeechRecognition init warning:", e);
            }
        };

        function ensureVoiceRecognitionRunning() {
            if (!voiceRecognition) initVoiceAgent();
            if (!voiceRecognition) return;
            if (!isVoiceListening) {
                try {
                    voiceRecognition.start();
                } catch (e) {
                    // Recognition may already be starting or active
                }
            }
        }

        // =========================================================================
        // HANDS-FREE SESSION LIFECYCLE MANAGEMENT (Directives 1, 2, 8, 10, 11)
        // =========================================================================
        window.startHandsFreeSession = function () {
            if (!voiceRecognition) initVoiceAgent();
            if (!voiceRecognition) {
                showSimbaToast("Speech recognition is not supported in this browser. Please use Chrome or Edge.", "warning", 3500);
                return;
            }
            isHandsFreeConversationalActive = true;
            isHandsFreeEnabled = true;
            activeVoiceSessionId = 'vhf_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
            activeVoiceTurnId = 'vturn_' + (++voiceTurnCounter);

            // Sync hidden checkbox if present
            const chk = document.getElementById('voiceAutoListenToggle');
            if (chk) chk.checked = true;

            showSimbaToast("Hands-Free mode active. Listening...", "success", 2500);
            setVoiceState('LISTENING', 'Listening...', null, { subtext: 'Hands-Free active. Speak naturally to Simba...' });
            ensureVoiceRecognitionRunning();
        };

        window.stopHandsFreeSession = function (reason) {
            isHandsFreeConversationalActive = false;
            isHandsFreeEnabled = false;
            activeVoiceSessionId = null;
            activeVoiceTurnId = null;

            if (handsFreeBreatherTimer) {
                clearTimeout(handsFreeBreatherTimer);
                handsFreeBreatherTimer = null;
            }
            if (voiceAutoRestartTimer) {
                clearTimeout(voiceAutoRestartTimer);
                voiceAutoRestartTimer = null;
            }

            // Sync hidden checkbox if present
            const chk = document.getElementById('voiceAutoListenToggle');
            if (chk) chk.checked = false;

            // Stop TTS immediately
            simbaStopSpeaking(false);

            // Stop speech recognition completely
            if (voiceRecognition) {
                try { voiceRecognition.abort(); } catch (e) {
                    try { voiceRecognition.stop(); } catch (_) { }
                }
            }
            isVoiceListening = false;
            if (typeof stopMicAudioCapture === 'function') {
                stopMicAudioCapture();
            }
            if (typeof playVoiceSfx === 'function') {
                playVoiceSfx('listen_stop');
            }

            // Abort pending fetch if in progress
            if (currentAbortController) {
                try { currentAbortController.abort(); } catch (e) { }
            }

            setVoiceState('READY', 'Ready to Listen', null, { subtext: reason || 'Hands-Free session ended.' });
            showSimbaToast(reason || "Hands-Free session ended.", "info", 2000);
        };

        window.toggleHandsFreeConversationalMode = function () {
            if (isHandsFreeConversationalActive) {
                stopHandsFreeSession('Hands-Free session stopped by user.');
            } else {
                startHandsFreeSession();
            }
        };

        window.toggleHandsFreeVoice = function (enabled) {
            if (Boolean(enabled)) {
                if (!isHandsFreeConversationalActive) startHandsFreeSession();
            } else {
                if (isHandsFreeConversationalActive) stopHandsFreeSession();
            }
        };

        window.cancelVoiceInteraction = function (reason) {
            const current = window.simbaVoiceState.status;
            if (current === 'READY' || current === 'CANCELLED') return;

            // 1. Cancel browser speech capture if manual
            if (!isHandsFreeConversationalActive && voiceRecognition && isVoiceListening) {
                try { voiceRecognition.stop(); } catch (e) { }
                isVoiceListening = false;
            }

            // 2. Cancel browser speech synthesis
            simbaStopSpeaking(false);

            // 3. Stop running Agent task if in ACTING
            if (current === 'ACTING' && typeof stopCurrentAgentTask === 'function') {
                try { stopCurrentAgentTask(); } catch (e) { }
            }

            // 4. Abort chat fetch if in UNDERSTANDING
            if (current === 'UNDERSTANDING' && typeof currentAbortController !== 'undefined' && currentAbortController) {
                try { currentAbortController.abort(); } catch (e) { }
            }

            // 5. Invalidate current turn ID so late responses do not speak
            activeVoiceTurnId = 'vturn_' + (++voiceTurnCounter);

            // 6. Transition
            if (isHandsFreeConversationalActive) {
                setVoiceState('LISTENING', 'Listening...', null, { subtext: reason || 'Voice interaction stopped. Listening for your next query...' });
                ensureVoiceRecognitionRunning();
            } else {
                setVoiceState('CANCELLED', 'Cancelled', reason || 'Voice interaction cancelled by user.');
                showSimbaToast('Voice interaction cancelled.', 'info', 2000);
            }
        };

        window.toggleVoiceAgentListening = function () {
            if (!voiceRecognition) initVoiceAgent();
            if (!voiceRecognition) {
                showSimbaToast("Speech recognition is not supported in this browser. Please use Chrome or Edge.", "warning", 3500);
                return;
            }
            simbaStopSpeaking(false);
            if (isVoiceListening) {
                cancelVoiceInteraction('User stopped listening');
            } else {
                if (window.simbaVoiceState.status !== 'READY') {
                    window.simbaVoiceStateMachine.transition('READY');
                }
                try {
                    voiceRecognition.start();
                } catch (e) {
                    try { voiceRecognition.stop(); voiceRecognition.start(); } catch (_) { }
                }
            }
        };

        window.stopVoiceListening = function () {
            if (voiceRecognition && isVoiceListening) {
                try { voiceRecognition.stop(); } catch (e) { }
            }
            isVoiceListening = false;
            cancelVoiceInteraction('Listening stopped by user');
        };

        // Unified Voice Uplink toggle for composer mic and command palette
        window.toggleVoiceUplink = function () {
            const sessionType = new URLSearchParams(window.location.search).get('type') || '{{ session_type|default:"assistant" }}';
            if (sessionType === 'voice') {
                toggleHandsFreeConversationalMode();
            } else {
                const mic = document.getElementById('micBtn');
                if (mic && typeof mic.onclick === 'function') {
                    mic.onclick();
                }
            }
        };

        function handleVoiceCommand(spokenText, turnId, sessionId) {
            if (!spokenText) return;
            const lower = spokenText.toLowerCase();

            // 1. Voice stop / interrupt
            if (VOICE_STOP_REGEX.test(lower) || VOICE_STOP_PHRASE_REGEX.test(lower)) {
                simbaStopSpeaking(false);
                cancelVoiceInteraction('Voice stop command detected');
                if (isHandsFreeConversationalActive) {
                    setVoiceState('LISTENING');
                }
                return;
            }

            // 2. Voice confirmation for pending sensitive agent actions
            const isWaitingPermission = Boolean(
                window.simbaAgentState &&
                window.simbaAgentState.status === 'WAITING_FOR_PERMISSION'
            );
            const pendingConfirmBtn = document.querySelector('.agent-confirm-actions .agent-btn-confirm, #btnAgentAllowPermission');
            const pendingCancelBtn = document.querySelector('.agent-confirm-actions .agent-btn-cancel, #btnAgentDenyPermission');

            if ((isWaitingPermission || pendingConfirmBtn) && /^(?:yes|confirm|allow|proceed|approve|do it|okay|sure)\b/i.test(lower)) {
                if (typeof approveCurrentAgentPermission === 'function') {
                    approveCurrentAgentPermission();
                } else if (pendingConfirmBtn) {
                    pendingConfirmBtn.click();
                }
                simbaSpeak("Action confirmed and proceeding.", turnId);
                return;
            }
            if ((isWaitingPermission || pendingCancelBtn) && /^(?:no|cancel|abort|stop|don't|reject|deny)\b/i.test(lower)) {
                if (typeof denyCurrentAgentPermission === 'function') {
                    denyCurrentAgentPermission();
                } else if (pendingCancelBtn) {
                    pendingCancelBtn.click();
                }
                cancelVoiceInteraction('Permission denied by user');
                return;
            }

            // 3. Intent Classifier: Action Task vs Conversational Question
            const isActionTask = /^(?:please\s+)?(?:open|launch|start|run|close|switch to|minimize|maximize|create|make|delete|remove|save|type|press|click|scroll|calculate|compute|solve|eval|search\s+(?:web|youtube|google|reddit|github)|inspect\s+screen|show\s+(?:me\s+)?(?:desktop|screen|tools)|list\s+(?:files|tools)|what(?:'s|\s+is)\s+(?:running|on\s+my\s+screen))\b/i.test(spokenText);

            const voiceTaskProgress = document.getElementById('voiceTaskProgress');
            const respCard = document.getElementById('voiceResponseCard');
            const respText = document.getElementById('voiceResponseText');

            if (isActionTask) {
                if (typeof playVoiceSfx === 'function') playVoiceSfx('action');
                setVoiceState('ACTING', 'Working...', null, { subtext: `Executing action: "${spokenText}"` });
                if (respCard) respCard.style.display = 'block';
                if (respText) respText.textContent = `Executing action: "${spokenText}"`;
                if (voiceTaskProgress) {
                    voiceTaskProgress.style.display = 'block';
                    voiceTaskProgress.innerHTML = `<span class="agent-lifecycle-badge status-executing"><i class="fa-solid fa-gear fa-spin"></i> INITIALIZING AGENT TASK...</span>`;
                }
                window.isVoiceActionRequest = true;
            } else {
                setVoiceState('UNDERSTANDING', 'Thinking...', null, { subtext: `Thinking: "${spokenText}"` });
                if (respCard) respCard.style.display = 'block';
                if (respText) respText.textContent = `Thinking...`;
                if (voiceTaskProgress) voiceTaskProgress.style.display = 'none';
                window.isVoiceActionRequest = false;
            }

            // Dispatch to composer/chat pipeline with forceInterrupt: true
            const input = document.getElementById('user-input');
            if (input) {
                input.value = spokenText;
                if (typeof autoResizeComposerInput === 'function') autoResizeComposerInput(input);
            }
            sendQuery(null, { forceInterrupt: true });
        }

        window.updateVoiceAgentTaskTelemetry = function (status, desc, title) {
            const sessionType = new URLSearchParams(window.location.search).get('type') || '{{ session_type|default:"assistant" }}';
            if (sessionType !== 'voice') return;
            const upper = (status || '').toUpperCase();
            const taskProgress = document.getElementById('voiceTaskProgress');
            const heroStatus = document.getElementById('voiceHeroStatus');
            const heroSubtext = document.getElementById('voiceHeroSubtext');
            const respCard = document.getElementById('voiceResponseCard');
            const respText = document.getElementById('voiceResponseText');

            if (!taskProgress) return;
            if (respCard) respCard.style.display = 'block';

            if (upper === 'UNDERSTANDING') {
                setVoiceState('UNDERSTANDING');
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-understanding"><i class="fa-solid fa-brain"></i> UNDERSTANDING TASK</span>`;
            } else if (upper === 'PLANNING') {
                setVoiceState('ACTING', 'Working...', null, { subtext: desc || 'Determining required tools and validation steps...' });
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-planning"><i class="fa-solid fa-diagram-project"></i> SYNTHESIZING TASK PLAN</span>`;
            } else if (upper === 'WAITING_FOR_PERMISSION') {
                setVoiceState('ACTING', 'Working...', null, { subtext: 'Awaiting authorization for sensitive operation...' });
                taskProgress.style.display = 'block';
                const toolName = (window.simbaAgentState && window.simbaAgentState.activeTool) || 'system action';
                taskProgress.innerHTML = `
                        <div style="padding:10px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:6px; margin-top:6px;">
                            <div style="display:flex; align-items:center; gap:8px; color:#f59e0b; font-weight:700; font-size:12px; margin-bottom:6px;">
                                <i class="fa-solid fa-shield-halved"></i> PERMISSION REQUIRED FOR: ${escapeHtml(toolName.toUpperCase())}
                            </div>
                            <div style="font-size:11.5px; color:#cbd5e1; margin-bottom:8px;">Say "Yes" or "Allow" to authorize, or "Cancel" to abort.</div>
                            <div style="display:flex; gap:8px;">
                                <button type="button" class="btn-voice-action" onclick="approveCurrentAgentPermission()" style="background:rgba(16,185,129,0.2); border-color:#10b981!important; color:#10b981!important; padding:4px 10px; font-size:11px;">
                                    <i class="fa-solid fa-check"></i> Allow Once
                                </button>
                                <button type="button" class="btn-voice-action danger" onclick="denyCurrentAgentPermission()" style="padding:4px 10px; font-size:11px;">
                                    <i class="fa-solid fa-ban"></i> Cancel
                                </button>
                            </div>
                        </div>
                    `;
                simbaSpeak(`Permission is required to execute ${toolName}. Say 'Yes' or 'Allow' to confirm, or 'No' to cancel.`);
            } else if (upper === 'EXECUTING') {
                const tool = (window.simbaAgentState && window.simbaAgentState.activeTool) ? ` (${window.simbaAgentState.activeTool})` : '';
                const stepDesc = (window.simbaAgentState && window.simbaAgentState.currentStep?.description) || desc || 'Executing action...';
                setVoiceState('ACTING', 'Working...', null, { subtext: stepDesc });
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-executing"><i class="fa-solid fa-gear fa-spin"></i> EXECUTING: ${escapeHtml(stepDesc.slice(0, 45))}${escapeHtml(tool)}</span>`;
            } else if (upper === 'VERIFYING') {
                setVoiceState('ACTING', 'Working...', null, { subtext: 'Checking outcome integrity and system state...' });
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-verifying"><i class="fa-solid fa-shield-check"></i> VERIFYING OUTCOME</span>`;
            } else if (upper.includes('COMPLET')) {
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-completed"><i class="fa-solid fa-check"></i> TASK COMPLETED &amp; VERIFIED</span>`;
                const summary = (window.simbaAgentState && window.simbaAgentState.finalResult) || desc || 'Task completed successfully.';
                if (respText) respText.textContent = summary;
                simbaSpeak(summary);
            } else if (upper.includes('FAIL') || upper.includes('ERROR')) {
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-failed"><i class="fa-solid fa-triangle-exclamation"></i> TASK FAILED</span>`;
                const errMsg = (window.simbaAgentState && window.simbaAgentState.error) || desc || 'Task encountered an error during execution.';
                if (respText) respText.textContent = errMsg;
                setVoiceState('ERROR', 'TASK FAILED', errMsg);
                simbaSpeak('Task failed: ' + errMsg);
            } else if (upper.includes('CANCEL')) {
                taskProgress.style.display = 'block';
                taskProgress.innerHTML = `<span class="agent-lifecycle-badge status-cancelled"><i class="fa-solid fa-ban"></i> TASK CANCELLED</span>`;
                if (respText) respText.textContent = 'Action execution was cancelled.';
                setVoiceState('CANCELLED', 'Cancelled', 'Task was cancelled.');
                simbaSpeak('Task was cancelled.');
            }
        };

        window.maybeVoiceSpeakResponse = function (rawText, turnMeta) {
            if (window.simbaVoiceState && window.simbaVoiceState.isCancelled) {
                return; // Do not speak cancelled result
            }
            // Invalidate stale turn (Directive 8)
            if (turnMeta && turnMeta.turnId && activeVoiceTurnId && turnMeta.turnId !== activeVoiceTurnId) {
                console.log('[Voice] Discarded stale voice turn response:', turnMeta.turnId, 'active turn is:', activeVoiceTurnId);
                return;
            }
            if (isHandsFreeConversationalActive && !activeVoiceSessionId) {
                return;
            }
            const sessionType = new URLSearchParams(window.location.search).get('type') || '{{ session_type|default:"assistant" }}';
            if (sessionType !== 'voice' && !isHandsFreeConversationalActive && !isHandsFreeEnabled) {
                return;
            }
            simbaSpeak(rawText, turnMeta?.turnId);
        };

        window.simbaSpeak = function (text, turnId) {
            if (!('speechSynthesis' in window)) return;
            if (turnId && activeVoiceTurnId && turnId !== activeVoiceTurnId) {
                console.log('[Voice] simbaSpeak ignored superseded turn', turnId);
                return;
            }
            if (window.simbaVoiceState && window.simbaVoiceState.isCancelled && window.simbaVoiceState.status === 'CANCELLED') return;

            // Stop any existing speech cleanly before starting new utterance
            simbaStopSpeaking(false);

            let clean = (text || '')
                .replace(/<div class="simba-action-card[\s\S]*?<\/div>\s*<\/div>/gi, '')
                .replace(/<[^>]+>/g, '')
                .replace(/SIMBA_STATUS:\s*[^\n\r]+/g, '')
                .replace(/```[\s\S]*?```/g, 'Code block generated.')
                .replace(/[*_#`~\[\]]/g, '')
                .trim();

            if (text && text.includes('PERMISSION REQUIRED')) {
                clean = "Permission is required to execute this action. Please click Allow Once, or say 'Yes' to confirm or 'Cancel' to abort.";
            }

            if (!clean) return;

            const sentences = clean.match(/[^.!?]+[.!?]+/g);
            if (sentences && sentences.length > 3) {
                clean = sentences.slice(0, 3).join(' ');
            }

            const respCard = document.getElementById('voiceResponseCard');
            const respText = document.getElementById('voiceResponseText');
            const stopBtn = document.getElementById('btnStopSpeaking');
            const cardStopBtn = document.getElementById('voiceCardStopSpeaking');
            if (respCard && respText) {
                respText.textContent = clean;
                respCard.style.display = 'block';
            }
            if (stopBtn) stopBtn.style.display = 'inline-flex';
            if (cardStopBtn) cardStopBtn.style.display = 'inline-flex';

            activeVoiceUtteranceText = clean.toLowerCase();
            isSimbaSpeaking = true;

            voiceCurrentUtterance = new SpeechSynthesisUtterance(clean);
            voiceCurrentUtterance.rate = _voiceSpeechRate || 1.0;
            voiceCurrentUtterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            let preferredVoice = null;
            if (_selectedVoicePersona) {
                preferredVoice = voices.find(v => v.name === _selectedVoicePersona);
            }
            if (!preferredVoice) {
                preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Microsoft')));
            }
            if (preferredVoice) voiceCurrentUtterance.voice = preferredVoice;

            voiceCurrentUtterance.onstart = function () {
                isSimbaSpeaking = true;
                setVoiceState('SPEAKING');
                ensureVoiceRecognitionRunning();
                if (typeof recordSpokenTurn === 'function') {
                    recordSpokenTurn(lastProcessedVoiceTranscript, clean, window.isVoiceActionRequest, window.simbaAgentState && window.simbaAgentState.activeTool);
                }
            };

            voiceCurrentUtterance.onend = function () {
                isSimbaSpeaking = false;
                activeVoiceUtteranceText = '';
                if (stopBtn) stopBtn.style.display = 'none';
                if (cardStopBtn) cardStopBtn.style.display = 'none';
                setVoiceState('COMPLETED');

                if (isHandsFreeConversationalActive) {
                    // Return automatically to LISTENING after short 400ms breather
                    clearTimeout(handsFreeBreatherTimer);
                    handsFreeBreatherTimer = setTimeout(() => {
                        if (isHandsFreeConversationalActive && !isSimbaSpeaking) {
                            if (typeof playVoiceSfx === 'function') playVoiceSfx('listen_start');
                            setVoiceState('LISTENING', 'Listening...', null, { subtext: 'Listening for your next query...' });
                            ensureVoiceRecognitionRunning();
                        }
                    }, 400);
                } else {
                    voiceIdleResetTimer = setTimeout(() => {
                        if (window.simbaVoiceState.status === 'COMPLETED') {
                            setVoiceState('READY');
                        }
                    }, 3000);
                }
            };

            voiceCurrentUtterance.onerror = function (event) {
                isSimbaSpeaking = false;
                activeVoiceUtteranceText = '';
                if (stopBtn) stopBtn.style.display = 'none';
                if (cardStopBtn) cardStopBtn.style.display = 'none';
                const err = event && event.error;
                // Ignore intentional interruption / preemption
                if (err === 'interrupted' || err === 'canceled') {
                    if (window.simbaVoiceState && window.simbaVoiceState.status === 'SPEAKING') {
                        if (isHandsFreeConversationalActive) {
                            setVoiceState('LISTENING');
                        } else {
                            setVoiceState('READY');
                        }
                    }
                    return;
                }
                console.warn("Speech synthesis error:", err);
                setVoiceState('ERROR', 'TTS ERROR', 'Speech synthesis was unavailable or failed.');
                // Auto-recover after 1.2 seconds so conversational loop does not get stuck
                if (isHandsFreeConversationalActive) {
                    setTimeout(() => {
                        if (isHandsFreeConversationalActive && !isSimbaSpeaking) {
                            setVoiceState('LISTENING');
                            ensureVoiceRecognitionRunning();
                        }
                    }, 1200);
                } else {
                    setTimeout(() => {
                        if (window.simbaVoiceState && window.simbaVoiceState.status === 'ERROR' && window.simbaVoiceState.error === 'TTS ERROR') {
                            setVoiceState('READY');
                        }
                    }, 3000);
                }
            };

            window.speechSynthesis.speak(voiceCurrentUtterance);
        };

        window.simbaStopSpeaking = function (resetState = true) {
            isSimbaSpeaking = false;
            activeVoiceUtteranceText = '';
            if (voiceCurrentUtterance) {
                voiceCurrentUtterance.onstart = null;
                voiceCurrentUtterance.onend = null;
                voiceCurrentUtterance.onerror = null;
            }
            if ('speechSynthesis' in window) {
                try { window.speechSynthesis.cancel(); } catch (e) { }
            }
            voiceCurrentUtterance = null;
            const stopBtn = document.getElementById('btnStopSpeaking');
            const cardStopBtn = document.getElementById('voiceCardStopSpeaking');
            if (stopBtn) stopBtn.style.display = 'none';
            if (cardStopBtn) cardStopBtn.style.display = 'none';

            if (resetState && window.simbaVoiceState && (window.simbaVoiceState.status === 'SPEAKING' || window.simbaVoiceState.status === 'COMPLETED')) {
                if (isHandsFreeConversationalActive) {
                    setVoiceState('LISTENING', 'Listening...', null, { subtext: 'Stopped audio. Listening for your next query...' });
                    ensureVoiceRecognitionRunning();
                } else {
                    setVoiceState('READY');
                }
            }
        };
    </script>
