#     command: celery -A simba_web worker -l info
#     env_file:
#       - .env
#     depends_on:
#       - redis
# `web` would then just need CELERY_BROKER_URL=redis://redis:6379/0 (and
# REDIS_URL for caching, if used) added to .env - no change to this file's
# `web` service itself.
