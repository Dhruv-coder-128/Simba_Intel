# Local Docker workflow for the Django app + its Redis cache/broker +
# Celery worker. The database stays Supabase-hosted Postgres (via
# DATABASE_URL in .env), never a local Postgres container - nothing changes
# there. No Celery Beat service: there are no scheduled/periodic tasks
# anywhere in this project yet (chat/tasks.py's demo_ping_task is dispatched
# on demand, never on a schedule) - adding Beat now would be a second
# always-running process with nothing for it to actually schedule. Add it
# the moment a real periodic task exists; it's one more service block plus
# a CELERY_BEAT_SCHEDULE dict, no change to `celery` or `web` below.
services:
  redis:
    image: redis:7-alpine
    # No published port: only `web` (and later `celery`) need to reach
    # this, over the internal Compose network - never exposed to the host
    # or outside world.
    #
    # No volume: this is a pure cache today (nothing durable depends on it
    # surviving a restart - allauth's rate-limit counters and
    # virtual_provider.py's cooldown flags are both short-lived, 60-300s,
    # by design). Losing them on a restart just means those two resilience
    # features briefly reset, never data loss. Revisit if a future Celery
    # broker/result-backend shares this same instance and needs durability.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DEBUG the .env file has for this containerized
      # run specifically - this is the one setting genuinely worth pinning
      # here rather than leaving to .env, since "run it in Docker" usually
      # means "run it the way it'll actually be deployed."
      - DEBUG=False
      # `redis` here is the service name above, resolved via Compose's
      # built-in DNS - not "localhost", since this runs in `web`'s own
      # container, a separate network namespace from `redis`'s container.
      # Overrides any REDIS_URL left in .env (that file is meant for
      # non-Docker local dev, where REDIS_URL is normally unset entirely -
      # see config/settings/base.py's LocMemCache fallback).
      - REDIS_URL=redis://redis:6379/0
      # `web` never consumes tasks (that's `celery`, below) but it does
      # need to be able to dispatch them - any future view/management
      # command that calls some_task.delay() runs inside THIS container.
      # Without this, that call would default to config/settings/base.py's
      # CELERY_BROKER_URL fallback (redis://localhost:6379/1), which
      # doesn't exist inside this container's own network namespace -
      # confirmed by hand while verifying this phase: dispatching from
      # inside `web` failed with a bare "connection refused to localhost"
      # until this line was added.
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        # Waits for Redis to actually answer PING, not just for its
        # container process to start - a plain `depends_on: [redis]` only
        # guarantees start order, not readiness, and Redis is fast enough
        # to start that gunicorn could otherwise win the race and serve its
        # very first requests against a cache that isn't accepting
        # connections yet. Harmless either way (IGNORE_EXCEPTIONS in
        # config/settings/base.py's CACHES means a not-yet-ready Redis
        # degrades to cache misses, not crashes) - this just avoids that
        # window entirely.
        condition: service_healthy
    # No volumes: both staticfiles/ and uploads/ are plain directories
    # inside the container's own image layer (Dockerfile pre-creates and
    # chown's them to the non-root `app` user at build time). Neither needs
    # to be a Docker volume in this single-container setup - collectstatic
    # regenerates staticfiles/ on every single container start regardless
    # (see the Dockerfile CMD), so persisting it saves nothing, and
    # uploads/ is a write-then-immediately-delete scratch dir, never
    # read after the request that wrote it.
    #
    # A previous version mounted both: a *named* volume for staticfiles and
    # a *bind* mount for uploads. Both caused PermissionError under the
    # non-root `app` user - Docker initializes a fresh named volume's mount
    # point as root:root (the build-time `chown` never touches it, since
    # the volume is separate storage substituted in at container-start
    # time), and a bind mount takes its ownership from the host-side
    # directory, which won't generally match the container's `app` uid
    # either. Removing both sidesteps the problem entirely rather than
    # patching around it. If a shared, persistent staticfiles/ volume
    # becomes genuinely necessary later (e.g. Nginx reading collectstatic's
    # output directly instead of Whitenoise), see the Dockerfile's comment
    # on why pre-creating the directory before `chown` is what makes a
    # freshly-mounted volume inherit the right ownership at that point.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  celery:
    # Same image as `web` - it's the same Django project, just started with
    # a different command (a worker, not gunicorn). No separate Dockerfile:
    # one image, two roles, so a dependency bump/code change never needs to
    # be kept in sync across two separately-built images.
    build: .
    env_file:
      - .env
    environment:
      - DEBUG=False
      # Cache DB (0) - a task can use django.core.cache.cache exactly like
      # any Django view can (see chat/tasks.py's demo_ping_task) - without
      # this, the worker would silently fall back to its own per-process
      # LocMemCache (config/settings/base.py's REDIS_URL-unset branch)
      # instead of the same shared cache `web` uses.
      - REDIS_URL=redis://redis:6379/0
      # Broker DB (1) - deliberately different from the cache's DB 0 (see
      # config/settings/base.py's CELERY_BROKER_URL comment for why).
      - CELERY_BROKER_URL=redis://redis:6379/1
    command: celery -A simba_web worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Succeeds the moment any worker responds to `inspect ping` - only
      # one worker in this compose file, so this is unambiguous. Confirms
      # the worker process is actually connected and consuming, not just
      # that its container is running.
      test: ["CMD-SHELL", "celery -A simba_web inspect ping"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
